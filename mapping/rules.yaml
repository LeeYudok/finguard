- rule_id: finguard.java.jdbc-sqli
  code: FIN-SQLI-003
  cwe: CWE-89
  title: SQL 삽입(JDBC 문자열 연결)
  severity: ERROR
  basis: 개발보안가이드 「입력데이터 검증 및 표현 - SQL 삽입」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 19 (SQL Injection)"
  explain: 외부 입력(request 파라미터·헤더 등)이 검증 없이 SQL 문에 도달하고 있습니다(오염 추적 검출). PreparedStatement 바인딩을 사용해야 합니다.
  fix_example: |
