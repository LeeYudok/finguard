# finguard 매핑 테이블 — Semgrep 룰ID → 금보원/개발보안가이드 근거.
# 코멘트 근거 문구는 이 파일 값이 전부다. 임의 생성 금지.
# kisa_item 은 docs/평가기준_웹모바일HTS_66항목.md (금보원 2026 안내서 웹·모바일·HTS 섹션 발췌)와
# 대조해 확실한 것만 기입한다. ID·항목명은 안내서 원문 표기 그대로 쓴다.

- rule_id: finguard.swift.hardcoded-secret
  code: FIN-KEY-001
  cwe: CWE-798
  title: 하드코드된 중요정보
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 하드코드된 중요정보」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 43 (앱 소스코드 내 운영정보 노출 방지)"
  explain: 비밀번호·API 키·토큰이 소스코드에 문자열로 하드코드되어 있습니다. 바이너리 역공학이나 소스 유출 시 그대로 노출됩니다.
  fix_example: |
    ```swift
    // Keychain 등 보호 저장소에서 로드
    let apiKey = KeychainHelper.load(key: "api_key")
    ```

- rule_id: finguard.swift.http-url
  code: FIN-TLS-001
  cwe: CWE-319
  title: 중요정보 평문 전송(HTTP)
  severity: WARNING
  basis: 개발보안가이드 「보안기능 - 중요정보 평문 전송」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 65 (통신구간 암호화 적용)"
  explain: 평문 HTTP 로 통신하면 전송 구간에서 도청·변조가 가능합니다. 금융 앱은 전 구간 TLS 가 기본입니다.
  fix_example: |
    ```swift
    let url = URL(string: "https://api.example.com/v1")!
    ```

- rule_id: finguard.swift.userdefaults-sensitive
  code: FIN-STO-001
  cwe: CWE-922
  title: 중요정보 평문 저장(UserDefaults)
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 중요정보 평문 저장」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 26 (단말기 내 중요정보 저장 방지) / 전금감규정 제19조의2(비밀번호 보관 시 암호화)"
  explain: UserDefaults 는 암호화되지 않은 plist 로 저장되어 탈옥/백업 추출 시 그대로 읽힙니다. 비밀번호·토큰·카드번호는 Keychain 에 저장해야 합니다.
  fix_example: |
    ```swift
    // UserDefaults.standard.set(token, forKey: "auth_token")  // 금지
    KeychainHelper.save(key: "auth_token", value: token)
    ```

- rule_id: finguard.swift.uiwebview
  code: FIN-API-001
  cwe: CWE-477
  title: 폐기된 API 사용(UIWebView)
  severity: WARNING
  basis: 개발보안가이드 「API 오용 - 취약한 API 사용」
  kisa_item: ""
  explain: UIWebView 는 iOS 12 에서 폐기되었고 보안 패치가 중단되어 알려진 취약점이 방치됩니다. WKWebView 로 교체해야 합니다.
  fix_example: |
    ```swift
    let webView = WKWebView(frame: .zero, configuration: WKWebViewConfiguration())
    ```

- rule_id: finguard.swift.weak-hash
  code: FIN-CRY-001
  cwe: CWE-328
  title: 취약한 해시 알고리즘(MD5/SHA-1)
  severity: WARNING
  basis: 개발보안가이드 「보안기능 - 취약한 암호화 알고리즘 사용」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 52 (취약한 HTTPS 암호 알고리즘 이용)"
  explain: MD5/SHA-1 은 충돌 공격이 실증된 알고리즘으로 무결성·인증 용도로 사용할 수 없습니다. SHA-256 이상을 사용해야 합니다.
  fix_example: |
    ```swift
    import CryptoKit
    let digest = SHA256.hash(data: data)
    ```

- rule_id: finguard.swift.print-sensitive
  code: FIN-LOG-001
  cwe: CWE-532
  title: 로그 중요정보 노출
  severity: WARNING
  basis: 개발보안가이드 「에러처리 - 오류 메시지 정보노출」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 59 (디버그 로그 내 중요정보 노출 방지)"
  explain: 콘솔/시스템 로그에 비밀번호·토큰 등 중요정보가 출력되면 디바이스 로그 수집 도구로 유출될 수 있습니다.
  fix_example: |
    ```swift
    // print("token=\(token)")  // 금지
    print("token 발급 완료 (길이 \(token.count))")
    ```

- rule_id: finguard.swift.sql-interpolation
  code: FIN-SQLI-001
  cwe: CWE-89
  title: SQL 삽입
  severity: ERROR
  basis: 개발보안가이드 「입력데이터 검증 및 표현 - SQL 삽입」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 19 (SQL Injection)"
  explain: 사용자 입력이 문자열 보간으로 SQL 에 직접 삽입되고 있습니다. 바인딩 파라미터(?)를 사용해야 합니다.
  fix_example: |
    ```swift
    let stmt = try db.prepare("SELECT * FROM user WHERE id = ?")
    try stmt.bind(userId)
    ```

- rule_id: finguard.plist.ats-arbitrary-loads
  code: FIN-TLS-002
  cwe: CWE-319
  title: ATS 전역 해제
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 중요정보 평문 전송」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 65 (통신구간 암호화 적용)"
  explain: NSAllowsArbitraryLoads=true 는 앱 전체에서 평문 HTTP 를 허용해 Apple 플랫폼(iOS/macOS/watchOS/tvOS)의 전송보안(ATS)을 무력화합니다. 예외가 필요하면 도메인 단위 예외로 좁혀야 합니다.
  fix_example: |
    ```xml
    <key>NSAppTransportSecurity</key>
    <dict>
      <key>NSExceptionDomains</key>
      <dict><!-- 필요한 도메인만 최소 예외 --></dict>
    </dict>
    ```

- rule_id: finguard.swift.webview-file-access
  code: FIN-API-002
  cwe: CWE-749
  title: WebView 파일 접근 허용
  severity: WARNING
  basis: 개발보안가이드 「API 오용 - 위험한 기능 노출」
  kisa_item: ""
  explain: WebView 에서 file:// 접근을 허용하면 XSS 와 결합해 로컬 파일(쿠키·토큰 저장소) 탈취로 이어질 수 있습니다.
  fix_example: |
    ```swift
    // preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")  // 금지
    // 기본값(비허용) 유지
    ```

- rule_id: finguard.go.sql-sprintf
  code: FIN-SQLI-002
  cwe: CWE-89
  title: SQL 삽입(문자열 조립)
  severity: ERROR
  basis: 개발보안가이드 「입력데이터 검증 및 표현 - SQL 삽입」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 19 (SQL Injection)"
  explain: 외부 입력(요청 파라미터 등)이 검증 없이 SQL 문 조립에 도달하고 있습니다(오염 추적 검출). 바인딩 파라미터($1, ?)를 사용해야 합니다.
  fix_example: |
    ```go
    row := db.QueryRow("SELECT name FROM users WHERE id = $1", userID)
    ```

