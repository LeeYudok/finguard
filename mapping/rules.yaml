- rule_id: finguard.go.tls-skip-verify
  code: FIN-TLS-003
  cwe: CWE-295
  title: TLS 인증서 검증 비활성화
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 부적절한 인증서 유효성 검증」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 47 (서버 인증서 무결성 검증)"
  explain: InsecureSkipVerify=true 는 서버 인증서 검증을 건너뛰어 중간자 공격(MITM)에 그대로 노출됩니다.
  fix_example: |
    ```go
    // TLSClientConfig: &tls.Config{InsecureSkipVerify: true}  // 금지
    // 사설 CA 는 RootCAs 에 등록해서 검증을 유지한다
    ```

