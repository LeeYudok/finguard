  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 43 (앱 소스코드 내 운영정보 노출 방지)"
  explain: 암호화 키·솔트·IV 가 소스코드에 하드코드되어 있습니다. APK/바이너리 디컴파일 시 그대로 노출되어 암호화가 무력화됩니다. 키는 안전한 키 저장소(Keystore)에서 관리하고, 솔트·IV 는 매번 안전한 난수로 생성해야 합니다.
  fix_example: |
    ```kotlin
    val iv = ByteArray(16).also { SecureRandom().nextBytes(it) }
    val key = keyStore.getKey("alias", null) as SecretKey
    ```

- rule_id: finguard.android.mutable-pendingintent
