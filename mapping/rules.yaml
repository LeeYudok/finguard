  explain: MD5/SHA-1/DES/RC4/ECB 는 충돌·해독이 실증된 알고리즘·운영모드입니다. SHA-256 이상, AES-GCM 등으로 교체해야 합니다.
  fix_example: |
    ```ts
    const digest = crypto.createHash("sha256").update(data).digest("hex");
