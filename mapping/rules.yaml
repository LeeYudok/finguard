- rule_id: finguard.ts.dangerously-set-inner-html
  code: FIN-XSS-001
  cwe: CWE-79
  title: XSS 위험(dangerouslySetInnerHTML)
  severity: WARNING
  basis: 개발보안가이드 「입력데이터 검증 및 표현 - 크로스사이트 스크립트」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 58 (크로스 사이트 스크립팅 (XSS))"
  explain: dangerouslySetInnerHTML 에 신뢰할 수 없는 입력이 들어가면 스크립트가 그대로 실행됩니다. 꼭 필요하면 새니타이즈를 거쳐야 합니다.
  fix_example: |
    ```tsx
    <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(html) }} />
    ```

- rule_id: finguard.ts.eval
  code: FIN-INJ-001
  cwe: CWE-95
