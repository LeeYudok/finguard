  kisa_item: ""
  explain: PendingIntent 에 FLAG_MUTABLE 을 사용하면 이를 수신한 타 앱이 인텐트 내용을 변조할 수 있습니다. 변조가 불필요하면 FLAG_IMMUTABLE 을 사용해야 합니다.
  fix_example: |
    ```kotlin
    PendingIntent.getActivity(ctx, 0, intent, PendingIntent.FLAG_IMMUTABLE)
    ```

- rule_id: finguard.swift.insecure-trust
  code: FIN-TLS-011
  cwe: CWE-295
  title: 서버 인증서 검증 우회(iOS)
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 부적절한 인증서 유효성 검증」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 47 (서버 인증서 무결성 검증)"
  explain: URLSession 인증 챌린지에서 서버가 제시한 인증서를 검증 없이 예외 등록·신뢰하고 있습니다(SecTrustSetExceptions/URLCredential(trust:)). 만료·자가서명·공격자 인증서까지 통과되어 중간자 공격(MITM)으로 통신이 탈취될 수 있습니다.
  fix_example: |
    ```swift
    // 기본 검증을 따르거나, 공개키 피닝으로 서버 신원 확인
