  severity: ERROR
  basis: 개발보안가이드 「입력데이터 검증 및 표현 - 코드 삽입」
  kisa_item: ""
  explain: eval/new Function 에 외부 입력이 닿으면 임의 코드 실행으로 이어집니다. JSON.parse 등 안전한 대체 수단을 사용해야 합니다.
  fix_example: |
    ```ts
    const data = JSON.parse(input); // eval(input) 금지
    ```

