  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 32 (운영체제 명령실행)"
  explain: 변수로 조립된 명령을 shell=True(또는 os.system)로 실행하면 변수에 외부 입력이 닿는 순간 명령어 삽입이 됩니다. 인자 리스트 + shell=False 로 전환해야 합니다.
  fix_example: |
