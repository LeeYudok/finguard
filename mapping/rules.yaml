- rule_id: finguard.ts.tls-verify-disabled
  code: FIN-TLS-024
  cwe: CWE-295
  title: TLS 인증서 검증 비활성화(Node.js)
  severity: ERROR
  basis: 개발보안가이드 「보안기능 - 부적절한 인증서 유효성 검증」
  kisa_item: "전자금융기반시설 평가기준(2026) 웹·모바일·HTS 47 (서버 인증서 무결성 검증)"
