// 안드로이드 서명 설정 회귀 픽스처 (#73).
// finguard.config.gradle-committed-keystore — 레포 안 키스토어를 리터럴 경로로 가리키는 형태.

apply plugin: 'com.android.application'

android {
    compileSdkVersion 34

    signingConfigs {
        release {
            // EXPECT: finguard.config.gradle-committed-keystore
            storeFile file("../key/FixtureBank_ReleaseKey.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "fixture"
            keyPassword System.getenv("KEY_PASSWORD")
        }
        debug {
            // EXPECT: finguard.config.gradle-committed-keystore
            storeFile rootProject.file('key/FixtureBank_DebugKey')
        }
        ci {
            // 올바른 형태 — 경로를 환경변수로 주입한다. 검출되면 안 된다.
            storeFile file(System.getenv("KEYSTORE_PATH"))
        }
        machineLocal {
            // 빌드 머신 로컬 절대경로는 커밋 증거가 아니다. 검출되면 안 된다.
            storeFile file("/Users/builder/secrets/release.jks")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
        }
    }
}
