# 대조군 픽스처 — 어떤 룰에도 걸리면 안 된다 (#24).
# 스코프 확장으로 새로 열리는 일반 YAML 에서 대표적으로 유입되는 비-시크릿 라인들이다.
# safe_ 접두라 EXPECT 마커를 가질 수 없다.

datasource:
  url: jdbc:postgresql://db.example.com:5432/core
  # 환경변수 치환 — 올바른 사용법
  password: ${DB_PASSWORD}

auth:
  # 값이 플래그·스키마인 경우
  token_required: true
  api_key_rotation: false
  client_secret_source: env:CLIENT_SECRET

k8s:
  env:
    - name: DB_PASSWORD
      valueFrom: secretKeyRef

openapi:
  components:
    securitySchemes:
      ApiKeyAuth:
        type: apiKey
        name: X-API-KEY

masked:
  # 마스킹 플레이스홀더는 시크릿이 아니라 가리는 코드다
  password: "********"
  api_key: "your-api-key"
  client_secret: "CHANGE_ME"

placeholder_unquoted:
  # 따옴표 없는 스칼라 플레이스홀더 — 값 경계 앵커로 억제한다 (#23)
  password: placeholder
  api_key: your-api-key
  client-secret: DUMMY_LOCAL_SECRET
  signing_key: TODO

korean_guidance:
  # 국내 샘플 코드의 표준 관용구 — 입력 지시문이지 시크릿이 아니다 (#23)
  app_secret: 앱 시크릿키를 입력하세요
  api_key: 여기에 발급받은 키를 입력해 주세요
  password: 본인의 비밀번호를 입력하세요
  access_token: 예시 값입니다
