rules:
  # 1. 하드코딩 시크릿 (CWE-798)
  #   - val/var/const val 이름에 password/secret/apikey 등 + "리터럴8자+"
  #   - 제외: RHS 가 BuildConfig./R./getString( → 애초에 = " 로 시작 안 하므로 자동 제외
  #   - 제외: 값이 snake_case 식별자(api_token 등 키이름 상수) / 주석(//) 라인
  - id: finguard.kotlin.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·시크릿)가 하드코드되어 있습니다. BuildConfig·시크릿 저장소로 분리해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^\s*(?:private\s+|internal\s+|public\s+|protected\s+)?(?:const\s+)?(?:val|var)\s+\w*(?:password|passwd|secret|apikey|api_key|appsecret|privatekey)\w*\s*(?::\s*[\w<>?.]+)?\s*=\s*"(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+")(?![a-z]+(?:_[a-z]+)+")[^"]{8,}"'

  # 2. 취약 해시 (CWE-328)
  - id: finguard.kotlin.weak-hash
    languages: [regex]
    severity: WARNING
    message: 취약한 해시 알고리즘(MD5/SHA-1)을 사용하고 있습니다. SHA-256 이상을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: 'MessageDigest\.getInstance\(\s*"(?i:MD5|SHA-?1)"'

  # 3. 취약 암호 알고리즘/운영모드 (CWE-327)
  #   - DES/RC4/Blowfish, 블록암호 ECB. RSA/ECB(JCA 표기 관행)는 제외.
  - id: finguard.kotlin.weak-cipher
    languages: [regex]
    severity: ERROR
    message: 취약한 암호 알고리즘/운영모드(DES·RC4·ECB)를 사용하고 있습니다. AES/GCM 등 인증암호를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: 'Cipher\.getInstance\(\s*"(?i:DES|DESede|RC4|ARCFOUR|Blowfish)[^"]*"|Cipher\.getInstance\(\s*"(?!RSA)[^"]*/ECB/|Cipher\.getInstance\(\s*"(?!RSA")[A-Za-z][A-Za-z0-9]*"'

  # 4. 안전하지 않은 난수 (CWE-338)
  #   - 보안목적 변수(securekey/token/iv/salt/nonce/seed/otp/password/secret)에
  #     Math.random / java.util.Random / kotlin.random.Random 대입.
  #   - SecureRandom 은 \bRandom 경계로 자연 제외. 일반 UI 난수(index/delay 등)는 변수명으로 제외.
  #   - TransKey: securekey[i] = (Math.random() * 128.0)... 정탐 대상.
  - id: finguard.kotlin.insecure-random
    languages: [regex]
    severity: WARNING
    message: 보안 목적 값(키·토큰·IV·salt 등)을 안전하지 않은 난수로 생성하고 있습니다. java.security.SecureRandom 을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*))(?:.*\b)?(?:\b(?:iv|key|seed)\b|\w*(?:securekey|secretkey|seckey|sessionkey|privatekey|cryptokey|token|salt|nonce|otp|passwd|password|secret)\w*)\s*(?:\[[^\]]*\])?\s*[-+]?=\s*[^=][^;\n]*\b(?:Math\.random\s*\(|java\.util\.Random\s*\(|kotlin\.random\.Random\b|(?<!Secure)Random\s*\()'

  # 5. 민감정보 로깅 (CWE-532)
  - id: finguard.kotlin.log-sensitive
    languages: [regex]
    severity: WARNING
    message: 로그에 민감정보(비밀번호·토큰·PIN·응답본문 등)가 출력될 수 있습니다. 마스킹하거나 로깅을 제거해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\bLog\.[dviwe]\s*\((?:(?:"(?:\\.|[^"\\\n])*"|[^"\n])*?\b(?:password|passwd|secret|token|pin|ssn|dataBody|responseBody)\b|[^\n]*?\$\{?[\w.]*\b(?:password|passwd|secret|token|pin|ssn|dataBody|responseBody)\b)'

  # 6. SQL 문자열 조립 (CWE-89)
  #   - rawQuery/execSQL 에 문자열 템플릿($var) 또는 + 연결.
  #   - ? 바인딩(PreparedStatement 대응)은 제외. 주석(//) 제외.
  - id: finguard.kotlin.sql-raw
    languages: [regex]
    severity: ERROR
    message: SQL 문을 문자열 조립(템플릿·연결)으로 만들고 있습니다. 파라미터 바인딩(?, selectionArgs)을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\b(?:rawQuery|execSQL)\s*\(\s*(?:"[^"]*\$\{?[A-Za-z_][^"]*"|"[^"]*"\s*\+|[^,()]*\+\s*"[^"]*")'

  # 7. WebView JavaScript 활성화 (CWE-749)
  - id: finguard.kotlin.webview-js-enabled
    languages: [regex]
    severity: WARNING
    message: WebView 에서 JavaScript 를 활성화하고 있습니다. 신뢰할 수 없는 콘텐츠에는 비활성화하거나 접근을 통제해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\.javaScriptEnabled\s*=\s*true|setJavaScriptEnabled\s*\(\s*true\s*\))'

  # 8. WebView addJavascriptInterface (CWE-749)
  - id: finguard.kotlin.webview-js-interface
    languages: [regex]
    severity: WARNING
    message: WebView 에 addJavascriptInterface 로 네이티브 브릿지를 노출하고 있습니다. @JavascriptInterface 최소화·오리진 검증이 필요합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\.addJavascriptInterface\s*\('

  # 9. WebView 파일 접근 허용 (CWE-749)
  - id: finguard.kotlin.webview-file-access
    languages: [regex]
    severity: WARNING
    message: WebView 파일 접근(allowFileAccess / allowUniversalAccessFromFileURLs)을 허용하고 있습니다. file:// 경로 노출 위험이 있어 비활성화해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\.allowFileAccess\s*=\s*true|setAllowFileAccess\s*\(\s*true\s*\)|\.allowUniversalAccessFromFileURLs\s*=\s*true|setAllowUniversalAccessFromFileURLs\s*\(\s*true\s*\))'

  # 10. SharedPreferences 민감정보 평문 저장 (CWE-922)
  #   - putString 키가 token/password/pin/secret/account/card 등.
  #   - EncryptedSharedPreferences 사용 여부는 라인 단위로 판단 불가 → 코멘트에 안내(오탐 가능).
  - id: finguard.kotlin.sharedprefs-sensitive
    languages: [regex]
    severity: WARNING
    message: SharedPreferences 에 민감정보를 평문 저장하고 있을 수 있습니다. EncryptedSharedPreferences 또는 Keystore 를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\.putString\s*\(\s*"[^"]*(?i:token|password|passwd|pwd|secret|pin|account|card|ssn|credential)[^"]*"'

  # 11. 평문 HTTP URL (CWE-319)
  #   - localhost/사설루프백/스키마 네임스페이스/example 은 제외. 주석 제외.
  - id: finguard.kotlin.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP(http://) URL 이 하드코드되어 있습니다. HTTPS 를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # 12. OS 명령 실행 (CWE-78)
  - id: finguard.kotlin.os-command
    languages: [regex]
    severity: ERROR
    message: OS 명령을 실행하고 있습니다(Runtime.exec / ProcessBuilder). 외부 입력이 섞이면 명령 삽입 위험이 있어 사용을 지양해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\bRuntime\.getRuntime\(\)\.exec\s*\(|\bProcessBuilder\s*\()'

  - id: finguard.kotlin.hardcoded-crypto-material
    languages: [regex]
    severity: ERROR
    message: 암호화 키·salt·IV 가 소스에 하드코드되어 있습니다. APK 디컴파일 시 그대로 노출되어 암호화가 무력화됩니다.
    paths:
      include: ["*.kt"]
    pattern-regex: '(?im)^\s*(?:private\s+|internal\s+|public\s+|protected\s+)*(?:const\s+)?(?:val|var)\s+(?i:\w*(?:crypto|aes|enc|encrypt|secret)_?key\w*|salt|iv|ivkey|seckey)\s*(?::\s*[\w<>?.]+)?\s*=\s*"[A-Za-z0-9+/=]{7,}"'

  - id: finguard.android.mutable-pendingintent
    languages: [regex]
    severity: WARNING
    message: PendingIntent 에 FLAG_MUTABLE 을 사용하고 있습니다. 타 앱이 인텐트를 변조할 수 있으므로 FLAG_IMMUTABLE 을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.java"]
    pattern-regex: 'PendingIntent\.(?:getActivity|getService|getBroadcast|getForegroundService)\([^;]*FLAG_MUTABLE'
