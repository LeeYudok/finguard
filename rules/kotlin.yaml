rules:
  # 1. 하드코딩 시크릿 (CWE-798)
  #   - val/var/const val 이름에 password/secret/apikey 등 + "리터럴8자+"
  #   - 제외: RHS 가 BuildConfig./R./getString( → 애초에 = " 로 시작 안 하므로 자동 제외
  #   - 제외: 값이 snake_case 식별자(api_token 등 키이름 상수) / 주석(//) 라인
  - id: finguard.kotlin.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·시크릿)가 하드코드되어 있습니다. BuildConfig·시크릿 저장소로 분리해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    patterns:
      # 식별자 어휘는 6개 언어 공통 목록이다 (#36). 단독 `key` 는 넣지 않는다.
      - pattern-regex: '(?im)^\s*(?:private\s+|internal\s+|public\s+|protected\s+)?(?:const\s+)?(?:val|var)\s+\w*(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*\s*(?::\s*[\w<>?.]+)?\s*=\s*"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"]{8,}"'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      # 값 전체가 플레이스홀더인 unquoted 스칼라도 억제한다 (#23).
      # 따옴표를 optional 로 푸는 대신 값 경계(줄 끝)로 앵커해 "값 전체가 플레이스홀더"라는
      # 원래 의미를 보존한다 — 무앵커 부분일치로 바꾸면 실키 안의 우연한 xxx·todo 까지 억제된다.
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      # 국내 샘플 코드의 표준 관용구인 한국어 안내문은 시크릿이 아니라 입력 지시문이다 (#23).
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'
      # "식별자 == 값" 인 대문자 라벨 상수는 시크릿이 아니라 맵 키·화면 코드다 (#72).
      #   const val LOGINPWD = "LOGINPWD"                 → 배제
      #   const val MAIN_CODE_ENCKEYPAD = "ENCKEYPAD"     → 배제(마지막 세그먼트 == 값)
      # 조건을 "값이 대문자면 배제" 로 넓히면 API_KEY = "AKIAIOSFODNN7EXAMPLE" 같은
      # 실키까지 죽는다. 값이 식별자(또는 그 마지막 `_` 세그먼트)와 **정확히 같을 때만** 배제한다.
      - pattern-not-regex: '(?m)^[ \t]*(?:(?:private|internal|public|protected)[ \t]+)*(?:const[ \t]+)?(?:val|var)[ \t]+(?:[A-Z][A-Z0-9]*_)*([A-Z][A-Z0-9]*)[ \t]*(?::[ \t]*[\w<>?.]+)?[ \t]*=[ \t]*"\1"[ \t]*(?://.*)?$'

  # 2. 취약 해시 (CWE-328)
  #   - MessageDigest/Mac 직접 호출 외에, 알고리즘명을 문자열로 받는 사내 래퍼
  #     (CryptUtil.encrypt("MD5", ...) 류)와 DigestUtils.md5Hex 계열까지 본다 (#28).
  #     거래소 서명 유틸이 이 형태로 MD5 를 쓰고 있었는데 기존 패턴은 전혀 보지 못했다.
  #   - \s 는 개행을 포함하므로 인자가 다음 줄로 넘어가도 매칭된다.
  - id: finguard.kotlin.weak-hash
    languages: [regex]
    severity: WARNING
    message: 취약한 해시 알고리즘(MD5/SHA-1)을 사용하고 있습니다. SHA-256 이상(서명은 HMAC-SHA256)을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?:MessageDigest|Mac)\.getInstance\(\s*"(?i:MD5|SHA-?1|HmacMD5|HmacSHA-?1)"|\b(?:DigestUtils|Hashing)\.(?:md5|sha1)\w*\s*\(|\b\w*(?i:digest|hash|encrypt|sign|hmac)\w*\s*\(\s*"(?i:MD5|SHA-?1|HmacMD5|HmacSHA-?1)"'

  # 3. 취약 암호 알고리즘/운영모드 (CWE-327)
  #   - DES/RC4/Blowfish, 블록암호 ECB. RSA/ECB(JCA 표기 관행)는 제외.
  - id: finguard.kotlin.weak-cipher
    languages: [regex]
    severity: ERROR
    message: 취약한 암호 알고리즘/운영모드(DES·RC4·ECB)를 사용하고 있습니다. AES/GCM 등 인증암호를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: 'Cipher\.getInstance\(\s*"(?i:DES|DESede|RC4|ARCFOUR|Blowfish)[^"]*"|Cipher\.getInstance\(\s*"(?!RSA)[^"]*/ECB/|Cipher\.getInstance\(\s*"(?!RSA")[A-Za-z][A-Za-z0-9]*"'

  # 4. 안전하지 않은 난수 (CWE-338)
  #   - 보안목적 변수(securekey/token/iv/salt/nonce/seed/otp/password/secret)에
  #     Math.random / java.util.Random / kotlin.random.Random 대입.
  #   - SecureRandom 은 \bRandom 경계로 자연 제외. 일반 UI 난수(index/delay 등)는 변수명으로 제외.
  #   - TransKey: securekey[i] = (Math.random() * 128.0)... 정탐 대상.
  - id: finguard.kotlin.insecure-random
    languages: [regex]
    severity: WARNING
    message: 보안 목적 값(키·토큰·IV·salt 등)을 안전하지 않은 난수로 생성하고 있습니다. java.security.SecureRandom 을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*))(?:.*\b)?(?:\b(?:iv|key|seed)\b|\w*(?:securekey|secretkey|seckey|sessionkey|privatekey|cryptokey|token|salt|nonce|otp|passwd|password|secret)\w*)\s*(?:\[[^\]]*\])?\s*[-+]?=\s*[^=][^;\n]*\b(?:Math\.random\s*\(|java\.util\.Random\s*\(|kotlin\.random\.Random\b|(?<!Secure)Random\s*\()'

  # 5. 민감정보 로깅 (CWE-532)
  #   - 싱크를 Android Log.* 에서 서버측 로깅(slf4j log/logger.*, println, System.out.print*)
  #     까지 넓혔다 (#28). Kotlin Spring Boot 백엔드는 Log.d 를 쓰지 않아 종전 패턴이
  #     한 건도 발화하지 않았다.
  #   - 오탐 억제는 "라인 단위 mask/redact 어휘 제외" 를 쓰지 않는다. 검증에서
  #     log.debug("card=${mask(cardNo)}, password=$password") 처럼 한 필드만 마스킹하고
  #     다른 필드를 흘리는 라인을 통째로 지운다는 반박이 나왔다 — 마스킹 누락은 보통
  #     이 부분 마스킹 형태로 나타난다.
  #   - availableTokens/tokenBucket 등 레이트리밋 식별자는 어휘 조건이 \btoken\b 경계라
  #     애초에 매칭되지 않는다(제외 목록 불필요). 회귀는 safe_kotlin_server.kt 로 고정.
  - id: finguard.kotlin.log-sensitive
    languages: [regex]
    severity: WARNING
    message: 로그에 민감정보(비밀번호·토큰·PIN·응답본문 등)가 출력될 수 있습니다. 마스킹하거나 로깅을 제거해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\b(?:Log\.[dviwe]|log(?:ger)?\.(?:trace|debug|info|warn|error)|println|System\.out\.print(?:ln)?)\s*\((?:(?:"(?:\\.|[^"\\\n])*"|[^"\n])*?\b(?:password|passwd|secret|token|pin|ssn|dataBody|responseBody)\b|[^\n]*?\$\{?[\w.]*\b(?:password|passwd|secret|token|pin|ssn|dataBody|responseBody)\b)'

  # 6. SQL 문자열 조립 (CWE-89)
  #   - rawQuery/execSQL(Android) 에 더해 서버측 싱크(JPA createQuery/createNativeQuery,
  #     Hibernate createSQLQuery, Spring jdbcTemplate.*)를 추가했다 (#28).
  #   - 문자열 템플릿($var) 또는 + 연결이 싱크 인자에 직접 붙은 경우만.
  #   - ? 바인딩(PreparedStatement 대응)은 제외. 주석(//) 제외.
  - id: finguard.kotlin.sql-raw
    languages: [regex]
    severity: ERROR
    message: SQL 문을 문자열 조립(템플릿·연결)으로 만들고 있습니다. 파라미터 바인딩(?, selectionArgs, setParameter)을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\b(?:rawQuery|execSQL|createQuery|createNativeQuery|createSQLQuery|jdbcTemplate\.(?:query|update|execute|queryForObject|queryForList|queryForMap|batchUpdate))\s*\(\s*(?:"[^"]*\$\{?[A-Za-z_][^"]*"|"[^"]*"\s*\+|[^,()]*\+\s*"[^"]*")'

  # 7. WebView JavaScript 활성화 (CWE-749)
  - id: finguard.kotlin.webview-js-enabled
    languages: [regex]
    severity: WARNING
    message: WebView 에서 JavaScript 를 활성화하고 있습니다. 신뢰할 수 없는 콘텐츠에는 비활성화하거나 접근을 통제해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\.javaScriptEnabled\s*=\s*true|setJavaScriptEnabled\s*\(\s*true\s*\))'

  # 8. WebView addJavascriptInterface (CWE-749)
  - id: finguard.kotlin.webview-js-interface
    languages: [regex]
    severity: WARNING
    message: WebView 에 addJavascriptInterface 로 네이티브 브릿지를 노출하고 있습니다. @JavascriptInterface 최소화·오리진 검증이 필요합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\.addJavascriptInterface\s*\('

  # 9. WebView 파일 접근 허용 (CWE-749)
  - id: finguard.kotlin.webview-file-access
    languages: [regex]
    severity: WARNING
    message: WebView 파일 접근(allowFileAccess / allowUniversalAccessFromFileURLs)을 허용하고 있습니다. file:// 경로 노출 위험이 있어 비활성화해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\.allowFileAccess\s*=\s*true|setAllowFileAccess\s*\(\s*true\s*\)|\.allowUniversalAccessFromFileURLs\s*=\s*true|setAllowUniversalAccessFromFileURLs\s*\(\s*true\s*\))'

  # 10. SharedPreferences 민감정보 평문 저장 (CWE-922)
  #   - putString 키가 token/password/pin/secret/account/card 등.
  #   - EncryptedSharedPreferences 사용 여부는 라인 단위로 판단 불가 → 코멘트에 안내(오탐 가능).
  - id: finguard.kotlin.sharedprefs-sensitive
    languages: [regex]
    severity: WARNING
    message: SharedPreferences 에 민감정보를 평문 저장하고 있을 수 있습니다. EncryptedSharedPreferences 또는 Keystore 를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*\.putString\s*\(\s*"[^"]*(?i:token|password|passwd|pwd|secret|pin|account|card|ssn|credential)[^"]*"'

  # 11. 평문 HTTP URL (CWE-319)
  #   - localhost/사설루프백/스키마 네임스페이스/example 은 제외. 주석 제외.
  - id: finguard.kotlin.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP(http://) URL 이 하드코드되어 있습니다. HTTPS 를 사용해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.kotlin.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*"ws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # 12. OS 명령 실행 (CWE-78)
  - id: finguard.kotlin.os-command
    languages: [regex]
    severity: ERROR
    message: OS 명령을 실행하고 있습니다(Runtime.exec / ProcessBuilder). 외부 입력이 섞이면 명령 삽입 위험이 있어 사용을 지양해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*(?:\bRuntime\.getRuntime\(\)\.exec\s*\(|\bProcessBuilder\s*\()'

  - id: finguard.kotlin.hardcoded-crypto-material
    languages: [regex]
    severity: ERROR
    message: 암호화 키·salt·IV 가 소스에 하드코드되어 있습니다. APK 디컴파일 시 그대로 노출되어 암호화가 무력화됩니다.
    paths:
      include: ["*.kt"]
    patterns:
      - pattern-regex: '(?im)^\s*(?:private\s+|internal\s+|public\s+|protected\s+)*(?:const\s+)?(?:val|var)\s+(?i:\w*(?:crypto|aes|enc|encrypt|secret)_?key\w*|salt|iv|ivkey|seckey)\s*(?::\s*[\w<>?.]+)?\s*=\s*"[A-Za-z0-9+/=]{7,}"'
      # 라벨 상수 배제 (#72) — hardcoded-secret 의 "식별자 == 값" 주석 참조.
      - pattern-not-regex: '(?m)^[ \t]*(?:(?:private|internal|public|protected)[ \t]+)*(?:const[ \t]+)?(?:val|var)[ \t]+(?:[A-Z][A-Z0-9]*_)*([A-Z][A-Z0-9]*)[ \t]*(?::[ \t]*[\w<>?.]+)?[ \t]*=[ \t]*"\1"[ \t]*(?://.*)?$'

  - id: finguard.android.mutable-pendingintent
    languages: [regex]
    severity: WARNING
    message: PendingIntent 에 FLAG_MUTABLE 을 사용하고 있습니다. 타 앱이 인텐트를 변조할 수 있으므로 FLAG_IMMUTABLE 을 사용해야 합니다.
    paths:
      include: ["*.kt", "*.java"]
    pattern-regex: 'PendingIntent\.(?:getActivity|getService|getBroadcast|getForegroundService)\([^;]*FLAG_MUTABLE'

  # ──────────────────────────────────────────────────────────────────────────
  # Kotlin 서버(Spring Boot) 룰 (#28)
  #
  # 위 14개 룰은 전부 Android 관용구라 Kotlin 백엔드에서 한 건도 발화하지 않았다.
  # 아래는 서버측 전용이며, taint 룰은 languages:[kotlin] 로 Kotlin 문법 그대로 작성한다.
  # java.yaml 의 taint 룰에 `kotlin` 을 얹는 방식은 쓰지 않았다 — 그 패턴들이
  # `new File(...)` 처럼 Kotlin 에 없는 `new` 생성자 문법에 의존해 Kotlin 파일에서는
  # 0 findings 이고, Java 검출까지 흔들 위험만 있다(이슈 #28 검증 절).
  # ──────────────────────────────────────────────────────────────────────────

  # 15. Feign/HTTP 클라이언트 전체 로깅 (CWE-532)
  #   - feign Logger.Level.FULL 은 요청·응답의 헤더와 본문을 통째로 로그에 남긴다.
  #     PG·오픈뱅킹 연동 클라이언트에서는 Authorization 헤더와 결제 응답이 그대로 흐른다.
  - id: finguard.kotlin.feign-full-logging
    languages: [regex]
    severity: WARNING
    message: Feign 로깅 레벨이 FULL 입니다. 요청·응답 헤더와 본문이 통째로 로그에 남아 연동 시크릿(Authorization)·결제 응답이 노출됩니다. BASIC 이하로 낮추거나 민감 헤더를 마스킹해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?m)^(?![ \t]*(?://|\*)).*\bLogger\.Level\.(?:FULL|HEADERS)\b'

  # 16. 배포본에 남은 개발용 인증 우회 엔드포인트 (CWE-489)
  #   - 매핑 경로에 dev/local/test/debug 세그먼트가 있고 인증 관련 어휘가 함께 오는 경우.
  #   - 일반 업무 API(/api/v1/events 등)는 dev 세그먼트가 없어 걸리지 않는다.
  - id: finguard.kotlin.dev-backdoor-endpoint
    languages: [regex]
    severity: ERROR
    message: 개발·로컬 전용 인증 우회 엔드포인트가 소스에 남아 있습니다. 프로파일 분리로 운영 배포본에서 제거하거나 별도 인증을 걸어야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*)).*@(?:Get|Post|Put|Patch|Delete|Request)Mapping\s*\(\s*(?:value\s*=\s*)?"[^"]*/(?:dev|develop|local|test|debug|stub|mock)[\w-]*/[^"]*(?:login|signin|token|auth|admin|impersonat|su)[^"]*"'

  # 17. 스택트레이스 노출 (CWE-209)
  #   - printStackTrace 는 예외 내부 구조(쿼리·경로·라이브러리 버전)를 표준에러로 흘리고
  #     로깅 파이프라인을 우회해 마스킹도 적용되지 않는다.
  - id: finguard.kotlin.stacktrace-exposure
    languages: [regex]
    severity: WARNING
    message: printStackTrace 로 예외 스택트레이스를 그대로 출력하고 있습니다. 로거로 보내고 사용자 응답에는 내부 정보를 포함하지 않아야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    pattern-regex: '(?m)^(?![ \t]*(?://|\*)).*\.printStackTrace\s*\('

  # 18. 경로 조작 및 자원 삽입 (CWE-22) — Kotlin taint
  #   - OS 명령 삽입은 별도 taint 룰을 두지 않는다. 위 finguard.kotlin.os-command 가
  #     이미 모든 Runtime.exec/ProcessBuilder 를 ERROR 로 잡고 있어 같은 줄에 코멘트만
  #     두 번 달린다.
  - id: finguard.kotlin.path-traversal
    languages: [kotlin]
    severity: ERROR
    message: 외부 입력이 검증 없이 파일 경로로 사용되고 있습니다. 파일명만 취해(basename) 기준 디렉터리 하위인지 정규화 후 확인해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) = ...
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) = ...
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|ModelAttribute|RequestPart)$
          - pattern: $X
    pattern-sanitizers:
      # basename 만 취한 값은 상위 경로(..)를 벗어날 수 없다.
      - pattern: FilenameUtils.getName(...)
      - pattern: File(...).name
      - pattern: $P.fileName
    pattern-sinks:
      # File(x).name 처럼 basename 추출 목적의 생성은 싱크가 아니다.
      - patterns:
          - pattern-either:
              - pattern: File(...)
              - pattern: FileInputStream(...)
              - pattern: FileOutputStream(...)
              - pattern: Paths.get(...)
          - pattern-not-inside: File(...).name
          - pattern-not-inside: FilenameUtils.getName(...)

  # 19. 서버측 요청 위조 (CWE-918) — Kotlin taint
  - id: finguard.kotlin.ssrf
    languages: [kotlin]
    severity: WARNING
    message: 외부 입력이 서버가 호출할 URL 로 사용되고 있습니다. 호스트 허용목록으로 제한해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) = ...
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) = ...
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|ModelAttribute|RequestPart)$
          - pattern: $X
    # 싱크는 "URL 생성" 이 아니라 "실제 호출" 이다. URL(target) 만 만들고 호스트
    # 허용목록을 검사하는 정상 코드가 흔해서, 생성 자체를 싱크로 두면 오탐이 된다.
    pattern-sinks:
      - pattern: URL(...).readText(...)
      - pattern: URL(...).readBytes(...)
      - pattern: $U.openConnection(...)
      - pattern: $U.openStream(...)
      - pattern: $RT.getForObject(...)
      - pattern: $RT.getForEntity(...)
      - pattern: $RT.postForObject(...)
      - pattern: $RT.postForEntity(...)
      - pattern: $RT.exchange(...)

  # 20. 검증되지 않은 리다이렉트 (CWE-601) — Kotlin taint
  - id: finguard.kotlin.open-redirect
    languages: [kotlin]
    severity: WARNING
    message: 외부 입력이 리다이렉트 대상 URL 로 사용되고 있습니다. 상대경로 허용목록으로 제한해야 합니다.
    paths:
      include: ["*.kt", "*.kts"]
      exclude: ["*Test.kt", "*Test.kts"]
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN $X : $T, ...) = ...
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) { ... }
              - pattern-inside: |
                  fun $F(..., @$ANN(...) $X : $T, ...) = ...
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|ModelAttribute|RequestPart)$
          - pattern: $X
    pattern-sinks:
      - pattern: $RESP.sendRedirect(...)
      - pattern: RedirectView(...)

  # 테스트 코드에 복붙된 실키를 파일명으로 영원히 가리던 blanket exclude 를 걷어낸다 (#25).
  #
  #   - paths.include 는 기존 ERROR 룰의 exclude 와 **정확히 상호배타** 다. 같은 파일이 두 룰에
  #     걸려 ERROR + WARNING 코멘트가 중복으로 달리지 않게 한다.
  #   - severity 는 ERROR 를 유지한다. 파일명은 "운영 시크릿인가" 의 판정 근거가 아니고,
  #     테스트 파일에 박힌 실키는 git 히스토리 노출 관점에서 운영 코드의 하드코드와 위험이 같다
  #     (평가기준 43·23).
  #   - 대신 값의 "시크릿다움" 게이트로 노이즈를 거른다. 게이트는 AND 가 아니라 **OR** 다 —
  #     이슈 원안의 AND 게이트 `(?=[^"]*[A-Za-z])(?=[^"]*[0-9])[A-Za-z0-9+/=_.-]{20,}` 는
  #     이 이슈의 헤드라인 증거인 16자리 **숫자** API 키를 스스로 못 잡는다(영문 없음·20자 미만).
  #     순숫자 12자 이상 | base64/hex 계열 16자 이상 | 12자 이상 영문+숫자 혼합 중 하나면 통과.
  - id: finguard.kotlin.hardcoded-secret-test
    languages: [regex]
    severity: ERROR
    message: 테스트 코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다. 저장소와 git 히스토리에 그대로 남으므로 운영 코드와 동일하게 제거·회전해야 합니다.
    paths:
      include: ["*Test.kt", "*Test.kts"]
    patterns:
      - pattern-regex: '(?im)^\s*(?:private\s+|internal\s+|public\s+|protected\s+)?(?:const\s+)?(?:val|var)\s+\w*(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*\s*(?::\s*[\w<>?.]+)?\s*=\s*"(?=[0-9]{12,}|[A-Za-z0-9+/=_.\-]{16,}|(?=[^"]{12,})(?=[^"]*[A-Za-z])(?=[^"]*[0-9]))(?!https?://)(?!jdbc:)(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"]{8,}"'
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'
      # 라벨 상수 배제 (#72) — 운영 코드용 hardcoded-secret 과 동일 조건.
      - pattern-not-regex: '(?m)^[ \t]*(?:(?:private|internal|public|protected)[ \t]+)*(?:const[ \t]+)?(?:val|var)[ \t]+(?:[A-Z][A-Z0-9]*_)*([A-Z][A-Z0-9]*)[ \t]*(?::[ \t]*[\w<>?.]+)?[ \t]*=[ \t]*"\1"[ \t]*(?://.*)?$'
