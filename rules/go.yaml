rules:
  # taint(오염 추적) 모드: 외부 입력이 검증 없이 SQL 인자에 도달할 때만 검출.
  # 바인딩 인자는 sink 에서 제외(focus-metavariable), 내부 상수 조립은 잡지 않는다(#7).
  - id: finguard.go.sql-sprintf
    languages: [go]
    severity: ERROR
    message: 외부 입력이 검증 없이 SQL 문에 도달합니다. 바인딩 파라미터를 사용해야 합니다.
    paths:
      exclude: ["*_test.go"]
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.RawQuery
      - pattern: $R.PathValue(...)
      - pattern: $R.Header.Get(...)
      # net/http 밖 입력원 (#1): CLI 인자·flag·프레임워크(gin/echo)·discordgo 옵션.
      # source 확장은 taint 설계(외부 입력 도달 시만 발화)를 유지한다.
      - pattern: os.Args
      - pattern: flag.Arg(...)
      - pattern: flag.Args()
      # gin/echo 컨텍스트 메서드 — receiver 를 컨텍스트 계열 식별자로 제한하지
      # 않으면 db.Query(...) 같은 sink 표현까지 source 로 잡혀 오탐이 난다(ssrf 룰과 동일 수법).
      - patterns:
          - pattern-either:
              - pattern: $C.Query(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.PostForm(...)
              - pattern: $C.Param(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(c|ctx|gctx|ectx|gc|ec)$
      - pattern: $OPT.StringValue()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($SQL, ...)
              - pattern: $DB.QueryRow($SQL, ...)
              - pattern: $DB.Exec($SQL, ...)
              - pattern: $DB.QueryContext($CTX, $SQL, ...)
              - pattern: $DB.QueryRowContext($CTX, $SQL, ...)
              - pattern: $DB.ExecContext($CTX, $SQL, ...)
          - focus-metavariable: $SQL

  # 보조 휴리스틱 (#1): SQL 키워드로 시작하는 포맷 문자열에 %s/%v 가 있으면
  # 입력원 불문 WARNING. taint 룰(위)의 두 사각지대 — source 목록에 없는 입력원,
  # source 와 sink 가 다른 함수에 있는 경우(semgrep OSS 는 함수 간 추적 불가) — 를
  # 안전망으로 덮는다. 상수 조립도 잡히므로(#7 트레이드오프) ERROR 룰과 분리 운용.
  - id: finguard.go.sql-sprintf-heuristic
    languages: [go]
    severity: WARNING
    message: SQL 문장을 fmt.Sprintf 의 %s/%v 로 조립하고 있습니다. 입력원이 외부라면 SQL 삽입으로 이어집니다. 바인딩 파라미터를 사용해야 합니다.
    paths:
      exclude: ["*_test.go"]
    patterns:
      - pattern: fmt.Sprintf($FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: '(?is)^"\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b).*%[sv]'

  - id: finguard.go.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다.
    paths:
      include: ["*.go"]
      exclude: ["*_test.go"]
    patterns:
      - pattern-regex: '(?i)\b\w*(password|passwd|secret|apikey|api_key|appsecret)\w*\s*(:?=)\s*"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"%/][^"]{7,}"'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'

  - id: finguard.go.weak-crypto
    languages: [regex]
    severity: WARNING
    message: 취약한 암호 알고리즘(MD5/SHA-1/DES/RC4)을 import 하고 있습니다.
    paths:
      include: ["*.go"]
      exclude: ["*_test.go"]
    pattern-regex: '"crypto/(md5|sha1|des|rc4)"'

  # (구 finguard.go.math-rand 룰 제거 — import 만 보고 용도 불문 발화해 오탐.
  #  용도 기반 finguard.go.weak-rand-crypto 로 대체됨, #9)

  - id: finguard.go.tls-skip-verify
    languages: [regex]
    severity: ERROR
    message: InsecureSkipVerify 로 TLS 인증서 검증을 비활성화하고 있습니다.
    paths:
      include: ["*.go"]
      exclude: ["*_test.go"]
    pattern-regex: 'InsecureSkipVerify\s*:\s*true'

  - id: finguard.go.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.go"]
      exclude: ["*_test.go"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.go.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.go"]
      exclude: ["*_test.go"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*"ws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # ─────────────────────────────────────────────────────────────────────────
  # 1) OS 명령어 삽입 (CWE-78)
  #    외부 입력이 검증 없이 os/exec 의 실행파일명 또는 인자에 도달할 때 검출.
  #    내부 상수만으로 조립된 명령은 잡지 않는다.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.os-command-injection
    languages: [go]
    severity: ERROR
    message: 외부 입력이 검증 없이 OS 명령 실행 인자로 전달됩니다. 명령어·인자를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*_test.go"]
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.RawQuery
      - pattern: $R.PathValue(...)
      - pattern: $R.Header.Get(...)
      # net/http 밖 입력원 (#1): CLI 인자·flag·프레임워크(gin/echo)·discordgo 옵션.
      # source 확장은 taint 설계(외부 입력 도달 시만 발화)를 유지한다.
      - pattern: os.Args
      - pattern: flag.Arg(...)
      - pattern: flag.Args()
      # gin/echo 컨텍스트 메서드 — receiver 를 컨텍스트 계열 식별자로 제한하지
      # 않으면 db.Query(...) 같은 sink 표현까지 source 로 잡혀 오탐이 난다(ssrf 룰과 동일 수법).
      - patterns:
          - pattern-either:
              - pattern: $C.Query(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.PostForm(...)
              - pattern: $C.Param(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(c|ctx|gctx|ectx|gc|ec)$
      - pattern: $OPT.StringValue()
    pattern-sinks:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)

  # ─────────────────────────────────────────────────────────────────────────
  # 2) 오픈 리다이렉트 (CWE-601)
  #    외부 입력이 리다이렉트 목적지 URL 로 그대로 사용될 때 검출.
  #    focus-metavariable 로 URL 인자만 sink 로 삼아 w/r 인자에 의한 오탐을 막는다.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.open-redirect
    languages: [go]
    severity: WARNING
    message: 외부 입력이 검증 없이 리다이렉트 목적지로 사용됩니다. 허용된 내부 경로인지 검증해야 합니다.
    paths:
      exclude: ["*_test.go"]
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.RawQuery
      - pattern: $R.PathValue(...)
      - pattern: $R.Header.Get(...)
      # net/http 밖 입력원 (#1): CLI 인자·flag·프레임워크(gin/echo)·discordgo 옵션.
      # source 확장은 taint 설계(외부 입력 도달 시만 발화)를 유지한다.
      - pattern: os.Args
      - pattern: flag.Arg(...)
      - pattern: flag.Args()
      # gin/echo 컨텍스트 메서드 — receiver 를 컨텍스트 계열 식별자로 제한하지
      # 않으면 db.Query(...) 같은 sink 표현까지 source 로 잡혀 오탐이 난다(ssrf 룰과 동일 수법).
      - patterns:
          - pattern-either:
              - pattern: $C.Query(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.PostForm(...)
              - pattern: $C.Param(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(c|ctx|gctx|ectx|gc|ec)$
      - pattern: $OPT.StringValue()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Redirect($W, $REQ, $URL, $CODE)
              - pattern: $W.Header().Set("Location", $URL)
              - pattern: $W.Header().Add("Location", $URL)
          - focus-metavariable: $URL

  # ─────────────────────────────────────────────────────────────────────────
  # 3) 경로 조작 / 디렉터리 탐색 (CWE-22)
  #    외부 입력이 파일 열기 경로에 도달할 때 검출.
  #    filepath.Base 는 구분자를 제거하므로 sanitizer 로 인정한다.
  #    filepath.Clean 은 "../" 를 제거하지 않으므로(Clean("../x") == "../x")
  #    sanitizer 에서 제외한다 — 넣으면 실제 취약점을 놓친다.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.path-traversal
    languages: [go]
    severity: ERROR
    message: 외부 입력이 검증 없이 파일 경로로 사용됩니다. filepath.Base 로 정규화하고 허용 디렉터리 내부인지 확인해야 합니다.
    paths:
      exclude: ["*_test.go"]
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.RawQuery
      - pattern: $R.PathValue(...)
      - pattern: $R.Header.Get(...)
      # net/http 밖 입력원 (#1): CLI 인자·flag·프레임워크(gin/echo)·discordgo 옵션.
      # source 확장은 taint 설계(외부 입력 도달 시만 발화)를 유지한다.
      - pattern: os.Args
      - pattern: flag.Arg(...)
      - pattern: flag.Args()
      # gin/echo 컨텍스트 메서드 — receiver 를 컨텍스트 계열 식별자로 제한하지
      # 않으면 db.Query(...) 같은 sink 표현까지 source 로 잡혀 오탐이 난다(ssrf 룰과 동일 수법).
      - patterns:
          - pattern-either:
              - pattern: $C.Query(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.PostForm(...)
              - pattern: $C.Param(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(c|ctx|gctx|ectx|gc|ec)$
      - pattern: $OPT.StringValue()
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.ReadFile($P)
              - pattern: os.Create($P)
              - pattern: os.Remove($P)
              - pattern: os.OpenFile($P, ...)
              - pattern: os.WriteFile($P, ...)
              - pattern: ioutil.ReadFile($P)
              - pattern: ioutil.WriteFile($P, ...)
              - pattern: http.ServeFile($W, $REQ, $P)
          - focus-metavariable: $P

  # ─────────────────────────────────────────────────────────────────────────
  # 4) 서버측 요청 위조, SSRF (CWE-918)
  #    외부 입력이 서버가 발신하는 HTTP 요청의 URL 로 사용될 때 검출.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.ssrf
    languages: [go]
    severity: WARNING
    message: 외부 입력이 검증 없이 서버측 HTTP 요청 URL 로 사용됩니다(SSRF). 목적지 호스트를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*_test.go"]
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.RawQuery
      - pattern: $R.PathValue(...)
      - pattern: $R.Header.Get(...)
      # net/http 밖 입력원 (#1): CLI 인자·flag·프레임워크(gin/echo)·discordgo 옵션.
      # source 확장은 taint 설계(외부 입력 도달 시만 발화)를 유지한다.
      - pattern: os.Args
      - pattern: flag.Arg(...)
      - pattern: flag.Args()
      # gin/echo 컨텍스트 메서드 — receiver 를 컨텍스트 계열 식별자로 제한하지
      # 않으면 db.Query(...) 같은 sink 표현까지 source 로 잡혀 오탐이 난다(ssrf 룰과 동일 수법).
      - patterns:
          - pattern-either:
              - pattern: $C.Query(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.PostForm(...)
              - pattern: $C.Param(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(c|ctx|gctx|ectx|gc|ec)$
      - pattern: $OPT.StringValue()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($U)
              - pattern: http.Head($U)
              - pattern: http.Post($U, ...)
              - pattern: http.PostForm($U, ...)
              # 클라이언트 변수 경유. $CLIENT 를 client 계열 식별자로 제한하지 않으면
              # r.URL.Query().Get(...) 같은 표현까지 sink 로 잡혀 오탐이 난다.
              - patterns:
                  - pattern-either:
                      - pattern: $CLIENT.Get($U)
                      - pattern: $CLIENT.Head($U)
                      - pattern: $CLIENT.Post($U, ...)
                      - pattern: $CLIENT.PostForm($U, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: (?i)^\w*(client|httpc|hc)\w*$
              - pattern: http.NewRequest($M, $U, ...)
              - pattern: http.NewRequestWithContext($CTX, $M, $U, ...)
          - focus-metavariable: $U

  # ─────────────────────────────────────────────────────────────────────────
  # 5) 취약한 TLS 버전 (CWE-326)
  #    MinVersion 을 SSL3.0/TLS1.0/TLS1.1 로 "명시 지정" 한 경우만 검출.
  #    MinVersion 미지정은 Go 기본값(TLS1.2)이라 오탐 위험이 커서 제외한다.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.weak-tls-version
    languages: [go]
    severity: WARNING
    message: TLS 최소 버전이 SSL 3.0/TLS 1.0/TLS 1.1 로 지정되어 있습니다. tls.VersionTLS12 이상을 사용해야 합니다.
    paths:
      exclude: ["*_test.go"]
    patterns:
      # &tls.Config{...} 는 tls.Config{...} 패턴에도 매칭되므로 & 변형을 따로 쓰지 않는다.
      # (쓰면 같은 위치가 두 번 보고된다)
      - pattern-either:
          - pattern: "tls.Config{..., MinVersion: $V, ...}"
          - pattern: "tls.Config{..., MaxVersion: $V, ...}"
          - pattern: $C.MinVersion = $V
          - pattern: $C.MaxVersion = $V
      - metavariable-pattern:
          metavariable: $V
          pattern-either:
            - pattern: tls.VersionSSL30
            - pattern: tls.VersionTLS10
            - pattern: tls.VersionTLS11
      # 코멘트 위치를 취약한 버전 상수 줄로 좁힌다(구조체 리터럴 전체가 아니라).
      - focus-metavariable: $V

  # ─────────────────────────────────────────────────────────────────────────
  # 6) 예측 가능한 난수로 보안 토큰 생성 (CWE-338)
  #    math/rand 전용 API(Intn/Int31/Int63/Float64/Perm/Uint32/Uint64)의 결과가
  #    토큰·키·세션 등 보안 목적 식별자에 대입되는 경우만 검출한다.
  #    crypto/rand 에는 존재하지 않는 함수만 source 로 삼아 오탐을 막는다.
  # ─────────────────────────────────────────────────────────────────────────
  - id: finguard.go.weak-rand-crypto
    languages: [go]
    severity: WARNING
    message: 예측 가능한 math/rand 값이 보안 토큰·키·세션 식별자 생성에 사용됩니다. crypto/rand 를 사용해야 합니다.
    paths:
      exclude: ["*_test.go"]
    patterns:
      - pattern-either:
          - pattern: $NAME := $EXPR
          - pattern: $NAME = $EXPR
          - pattern: var $NAME = $EXPR
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^\w*(token|apikey|secretkey|sessionid|session_id|sessionkey|nonce|otp|salt|passwd|password|privatekey)\w*$
      - metavariable-pattern:
          metavariable: $EXPR
          pattern-either:
            # <... ...> 는 깊은 표현식 매칭. fmt.Sprintf("%d", rand.Int63()) 처럼
            # 감싸인 경우도 중첩 깊이에 상관없이 잡는다.
            - pattern: <... rand.Intn(...) ...>
            - pattern: <... rand.Int31(...) ...>
            - pattern: <... rand.Int31n(...) ...>
            - pattern: <... rand.Int63(...) ...>
            - pattern: <... rand.Int63n(...) ...>
            - pattern: <... rand.Uint32(...) ...>
            - pattern: <... rand.Uint64(...) ...>
            - pattern: <... rand.Float64(...) ...>
            - pattern: <... rand.Perm(...) ...>
