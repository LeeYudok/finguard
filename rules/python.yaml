rules:
  - id: finguard.python.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다.
    paths:
      include: ["*.py"]
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      # 식별자 어휘는 6개 언어 공통 목록이다 (#36). 단독 `key` 는 넣지 않는다 —
      # map key·헤더명으로 오탐이 폭증한다. app_secret·client_secret 은 `secret` 이,
      # apikey 는 `api[_-]?key` 가 이미 포섭하므로 중복 항목은 두지 않는다.
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*\s*=\s*(?:"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"%/{][^"]{7,}"|''(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+'')(?![a-z]+(?:_[a-z]+)+'')[^''%/{][^'']{7,}'')'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      # 값 전체가 플레이스홀더인 unquoted 스칼라도 억제한다 (#23).
      # 따옴표를 optional 로 푸는 대신 값 경계(줄 끝)로 앵커해 "값 전체가 플레이스홀더"라는
      # 원래 의미를 보존한다 — 무앵커 부분일치로 바꾸면 실키 안의 우연한 xxx·todo 까지 억제된다.
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      # 국내 샘플 코드의 표준 관용구인 한국어 안내문은 시크릿이 아니라 입력 지시문이다 (#23).
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'

  - id: finguard.python.weak-hash
    languages: [python]
    severity: WARNING
    message: 취약한 해시 알고리즘(MD5/SHA-1)을 사용하고 있습니다. SHA-256 이상으로 교체해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False)

  - id: finguard.python.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.py"]
      exclude: ["test_*.py", "*_test.py"]
    pattern-regex: '(?im)^(?![ \t]*#).*["'']http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|purl\.org|iana\.org|ietf\.org|json-schema\.org)[^"'']+["'']'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.python.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.py"]
      exclude: ["test_*.py", "*_test.py"]
    pattern-regex: '(?im)^(?![ \t]*#).*["'']ws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|purl\.org|iana\.org|ietf\.org|json-schema\.org)[^"'']+["'']'

  # 문자열 조립 SQL — f-string / % / .format 으로 만든 문장을 그대로 execute 에 전달.
  # 바인딩 파라미터(execute(sql, params)) 사용은 잡지 않는다.
  - id: finguard.python.sql-format
    languages: [python]
    severity: ERROR
    message: 문자열 포매팅으로 조립한 SQL 을 실행하고 있습니다. 바인딩 파라미터를 사용해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    pattern-either:
      - pattern: $CUR.execute(f"...", ...)
      - pattern: $CUR.execute($S.format(...), ...)
      - pattern: $CUR.execute($S % $A, ...)
      - pattern: $CUR.executemany(f"...", ...)
      - pattern: $CUR.executemany($S.format(...), ...)
      - pattern: $CUR.executemany($S % $A, ...)

  # shell=True + 비상수 명령 문자열. 상수 리터럴만으로 실행하는 경우는 잡지 않는다.
  - id: finguard.python.subprocess-shell
    languages: [python]
    severity: WARNING
    message: 변수로 조립된 명령을 shell=True(또는 os.system)로 실행합니다. 외부 입력이 닿으면 명령어 삽입으로 이어집니다. 인자 리스트 + shell=False 로 전환해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'

  - id: finguard.python.eval-exec
    languages: [python]
    severity: ERROR
    message: eval/exec 에 동적으로 조립된 문자열이 전달됩니다. 외부 입력이 닿으면 임의 코드 실행으로 이어집니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: '"..."'

  - id: finguard.python.tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: TLS 인증서 검증을 비활성화하고 있습니다(verify=False / 미검증 컨텍스트). 중간자 공격(MITM)에 노출됩니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    # 호출형만 보면 가장 파급이 큰 관용구를 놓친다 (#26).
    # `ssl._create_default_https_context = ssl._create_unverified_context` 는 호출 괄호가
    # 없어 기존 패턴에 안 걸리는데, 프로세스 전역 기본 컨텍스트를 바꿔 이후 모든 https
    # 호출을 MITM 에 노출시킨다. requests 외 클라이언트(httpx/aiohttp)와 컨텍스트 속성을
    # 직접 끄는 형태도 같은 결과라 함께 본다.
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      # 전역 기본 컨텍스트 교체 — 호출이 아니라 함수 객체 대입
      - pattern: ssl._create_default_https_context = ssl._create_unverified_context
      # 컨텍스트 속성 직접 무력화
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
      - pattern: $CTX.check_hostname = False
      # requests 외 HTTP 클라이언트
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
      - pattern: aiohttp.TCPConnector(..., ssl=False, ...)

  - id: finguard.python.yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: yaml.load 를 안전하지 않은 로더로 사용하고 있습니다. 신뢰할 수 없는 입력이면 객체 역직렬화로 임의 코드가 실행됩니다. yaml.safe_load 를 사용해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py"]
    pattern-either:
      - pattern: yaml.load($X)
      - pattern: yaml.load($X, Loader=yaml.Loader)
      - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
      - pattern: yaml.unsafe_load(...)

  # 와일드카드 CORS + 자격증명 허용 (#35).
  # Starlette CORSMiddleware 는 allow_origins=["*"] 와 allow_credentials=True 가 함께 오면
  # Access-Control-Allow-Origin 에 "*" 를 그대로 쓰지 않고 요청 Origin 을 반향(echo)하면서
  # Access-Control-Allow-Credentials: true 를 붙인다. "브라우저가 와일드카드+자격증명을
  # 거부하니 무해하다" 는 통념과 달리 임의 오리진이 자격증명 동반 요청에 성공한다.
  # 화이트리스트를 쓰는 정상 구현은 $O 조건에서 자연 제외된다.
  - id: finguard.python.cors-wildcard-credentials
    languages: [python]
    severity: ERROR
    message: 모든 오리진을 허용(*)하면서 자격증명(쿠키·인증헤더) 동반 요청까지 허용하고 있습니다. 임의 웹페이지가 이용자의 브라우저를 통해 인증된 엔드포인트를 호출할 수 있습니다. 허용 오리진을 명시적 화이트리스트로 제한해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=$O, ..., allow_credentials=True, ...)
          - pattern: CORSMiddleware(..., allow_origins=$O, ..., allow_credentials=True, ...)
          - pattern: CORS(..., origins=$O, ..., supports_credentials=True, ...)
      - metavariable-pattern:
          metavariable: $O
          pattern-either:
            - pattern: '["*"]'
            - pattern: '"*"'

  # 자격증명 없는 와일드카드 CORS (#35).
  # 브라우저가 쿠키·Authorization 헤더를 싣지 않으므로 위험도가 다르다 — 게이트를 막지
  # 않도록 WARNING 으로 분리한다. 자격증명까지 허용하는 경우는 위 ERROR 룰이 잡는다.
  - id: finguard.python.cors-wildcard-origin
    languages: [python]
    severity: WARNING
    message: 모든 오리진(*)에 CORS 를 허용하고 있습니다. 인증이 필요 없는 공개 API 가 아니라면 허용 오리진을 명시적 화이트리스트로 제한해야 합니다.
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=$O, ...)
          - pattern: CORSMiddleware(..., allow_origins=$O, ...)
          - pattern: CORS(..., origins=$O, ...)
      - metavariable-pattern:
          metavariable: $O
          pattern-either:
            - pattern: '["*"]'
            - pattern: '"*"'
      # 자격증명까지 허용하는 조합은 cors-wildcard-credentials(ERROR) 담당 — 중복 코멘트 방지
      - pattern-not: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ...)
      - pattern-not: CORSMiddleware(..., allow_credentials=True, ...)
      - pattern-not: CORS(..., supports_credentials=True, ...)

  # 자격증명 파일 영속화 (#31).
  #
  # 기존 시크릿 룰은 전부 '리터럴 대입' 만 본다. 금융 API 클라이언트의 실제 공통 결함은
  # 그게 아니라 런타임에 발급받은 액세스 토큰을 로컬에 떨구면서 권한을 좁히지 않는 것이다.
  # 기본 umask(0022) 로 0644 가 되면 다중 사용자 호스트에서 타 계정이 읽어 계좌조회·주문
  # API 를 그대로 호출할 수 있다.
  #
  # 억제 조건 설계:
  #   - pattern-not-inside 의 스코프는 with 블록이 아니라 **감싸는 함수 전체**다. chmod 는
  #     파일 핸들이 필요 없어 실무에서는 with 블록을 빠져나온 뒤 호출하는 형태가 흔하고,
  #     with 블록으로 스코프를 잡으면 그 안전한 코드를 억제하지 못한다(실측 확인).
  #   - chmod 존재만으로 억제하지 않는다. **소유자 전용 권한**(0o600/0o400/S_IRUSR 계열,
  #     umask 0o077, os.open 0o600)일 때만 억제한다 — os.chmod(path, 0o644) 나
  #     무관한 대상에 대한 os.chmod(LOG_DIR, 0o777) 는 억제 대상이 아니다.
  #
  # 싱크는 f.write 하나로 좁히지 않는다. json.dump·pickle.dump·Path.write_text·
  # configparser.write 로 떨구는 형태가 실제로는 더 많다. 자격증명 어휘는 쓰이는 값뿐
  # 아니라 대상 경로·파일 핸들 변수명에도 건다(값이 이름 있는 변수가 아니면 미매칭이므로).
  - id: finguard.python.credential-file-write
    languages: [python]
    severity: WARNING
    message: 런타임에 발급받은 자격증명(액세스 토큰·시크릿·비밀번호)을 로컬 파일에 저장하면서 파일 권한을 소유자 전용으로 좁히지 않고 있습니다. 저장 직후 os.chmod(path, 0o600) 으로 권한을 제한하거나 OS 자격증명 저장소를 사용해야 합니다. 이미 chmod 를 하고 있다면 권한값이 0o600/0o400 인지 확인이 필요합니다.
    paths:
      exclude: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-inside: |
          def $FUNC(...):
              ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $F.write($S)
                  - pattern: $F.writelines($S)
                  - pattern: json.dump($S, ...)
                  - pattern: pickle.dump($S, ...)
                  - pattern: $P.write_text($S, ...)
                  - pattern: $P.write_bytes($S, ...)
              - metavariable-regex:
                  metavariable: $S
                  regex: '(?is).*(access[_-]?token|refresh[_-]?token|token|secret|password|passwd|api[_-]?key|appsecret|credential|private[_-]?key|access[_-]?key).*'
          - patterns:
              - pattern-either:
                  - pattern: $F.write(...)
                  - pattern: $F.writelines(...)
                  - pattern: json.dump(..., $F, ...)
                  - pattern: pickle.dump(..., $F, ...)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?is).*(access[_-]?token|refresh[_-]?token|token|secret|password|passwd|api[_-]?key|appsecret|credential|private[_-]?key|access[_-]?key).*'
          - patterns:
              - pattern-either:
                  - pattern: $P.write_text(...)
                  - pattern: $P.write_bytes(...)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?is).*(access[_-]?token|refresh[_-]?token|token|secret|password|passwd|api[_-]?key|appsecret|credential|private[_-]?key|access[_-]?key).*'
          - patterns:
              - pattern-inside: |
                  with open($P, ...) as $F:
                      ...
              - pattern-either:
                  - pattern: $F.write(...)
                  - pattern: $F.writelines(...)
                  - pattern: json.dump(..., $F, ...)
                  - pattern: pickle.dump(..., $F, ...)
                  - pattern: $CP.write($F)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?is).*(access[_-]?token|refresh[_-]?token|token|secret|password|passwd|api[_-]?key|appsecret|credential|private[_-]?key|access[_-]?key).*'
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.chmod(..., 0o600)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.chmod(..., 0o400)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.chmod(..., stat.S_IRUSR | stat.S_IWUSR)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.chmod(..., stat.S_IRUSR)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              $Q.chmod(0o600)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              $Q.chmod(0o400)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.umask(0o077)
              ...
      - pattern-not-inside: |
          def $SAFE(...):
              ...
              os.open(..., 0o600)
              ...

  # 테스트 코드에 복붙된 실키를 파일명으로 영원히 가리던 blanket exclude 를 걷어낸다 (#25).
  #
  #   - paths.include 는 기존 ERROR 룰의 exclude 와 **정확히 상호배타** 다. 같은 파일이 두 룰에
  #     걸려 ERROR + WARNING 코멘트가 중복으로 달리지 않게 한다.
  #   - severity 는 ERROR 를 유지한다. 파일명은 "운영 시크릿인가" 의 판정 근거가 아니고,
  #     테스트 파일에 박힌 실키는 git 히스토리 노출 관점에서 운영 코드의 하드코드와 위험이 같다
  #     (평가기준 43·23).
  #   - 대신 값의 "시크릿다움" 게이트로 노이즈를 거른다. 게이트는 AND 가 아니라 **OR** 다 —
  #     이슈 원안의 AND 게이트 `(?=[^"]*[A-Za-z])(?=[^"]*[0-9])[A-Za-z0-9+/=_.-]{20,}` 는
  #     이 이슈의 헤드라인 증거인 16자리 **숫자** API 키를 스스로 못 잡는다(영문 없음·20자 미만).
  #     순숫자 12자 이상 | base64/hex 계열 16자 이상 | 12자 이상 영문+숫자 혼합 중 하나면 통과.
  - id: finguard.python.hardcoded-secret-test
    languages: [regex]
    severity: ERROR
    message: 테스트 코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다. 저장소와 git 히스토리에 그대로 남으므로 운영 코드와 동일하게 제거·회전해야 합니다.
    paths:
      include: ["test_*.py", "*_test.py", "conftest.py"]
    patterns:
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*\s*=\s*(?:"(?=[0-9]{12,}|[A-Za-z0-9+/=_.\-]{16,}|(?=[^"]{12,})(?=[^"]*[A-Za-z])(?=[^"]*[0-9]))(?!https?://)(?!jdbc:)(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"%/{][^"]{7,}"|''(?=[0-9]{12,}|[A-Za-z0-9+/=_.\-]{16,}|(?=[^'']{12,})(?=[^'']*[A-Za-z])(?=[^'']*[0-9]))(?!https?://)(?!jdbc:)(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+'')(?![a-z]+(?:_[a-z]+)+'')[^''%/{][^'']{7,}'')'
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'
