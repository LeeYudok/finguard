rules:
  - id: finguard.shell.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 셸 스크립트에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다. 환경변수 주입 또는 시크릿 저장소를 사용해야 합니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    patterns:
      # 식별자 어휘는 6개 언어 공통 목록이다 (#36). 단독 `key` 는 넣지 않는다.
      # 단독 `token` 은 이 룰의 기존 항목이라 유지한다.
      - pattern-regex: '(?im)^\s*(?:export\s+)?\w*(password|passwd|pwd|secret|api[_-]?key|token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*=["'']?(?!\$)(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+["'']?\s*$)(?![a-z]+(?:_[a-z]+)+["'']?\s*$)[^"''\s#$][^"''\s#]{7,}'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      # 값 전체가 플레이스홀더인 unquoted 스칼라도 억제한다 (#23).
      # 따옴표를 optional 로 푸는 대신 값 경계(줄 끝)로 앵커해 "값 전체가 플레이스홀더"라는
      # 원래 의미를 보존한다 — 무앵커 부분일치로 바꾸면 실키 안의 우연한 xxx·todo 까지 억제된다.
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      # 국내 샘플 코드의 표준 관용구인 한국어 안내문은 시크릿이 아니라 입력 지시문이다 (#23).
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'

  - id: finguard.shell.curl-insecure
    languages: [regex]
    severity: ERROR
    message: curl 이 -k/--insecure 로 TLS 인증서 검증을 끄고 있습니다. 중간자 공격(MITM)에 노출됩니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    # heredoc 본문(`cat <<EOF ... EOF`)은 출력되는 문자열이지 실행되는 명령이 아니다 (#72).
    # 실제 배포 스크립트의 안내문 `검증: curl -sk https://... → 200` 이 오탐이었다.
    # 첫 대안이 heredoc 블록 전체를 매칭한 뒤 (*SKIP)(*FAIL) 로 그 구간을 통째로 건너뛴다.
    # PCRE 백트래킹 verb 이며 semgrep 의 regex 엔진에서 동작을 실측했다.
    # 종료 구분자는 `<<-` 들여쓰기 형태와 `<<'EOF'` 인용 형태를 함께 받는다.
    # heredoc 밖의 실제 요청(`curl -sk ...`·`sudo curl -kL ...`)은 그대로 검출된다.
    pattern-regex: |-
      (?m)<<-?[ \t]*(['"]?)([A-Za-z_][A-Za-z0-9_]*)\1[^\n]*\n(?s:.*?)\n[ \t]*\2[ \t]*(?:\n|$)(*SKIP)(*FAIL)|^(?!\s*#)[^\n]*\bcurl\b[^|\n]*(?:\s-[A-Za-z]*k[A-Za-z]*\b|\s--insecure\b)

  - id: finguard.shell.wget-insecure
    languages: [regex]
    severity: ERROR
    message: wget 이 --no-check-certificate 로 TLS 인증서 검증을 끄고 있습니다. 중간자 공격(MITM)에 노출됩니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    pattern-regex: '(?m)^(?!\s*#)[^\n]*\bwget\s[^|\n]*--no-check-certificate\b'

  - id: finguard.shell.curl-pipe-shell
    languages: [regex]
    severity: WARNING
    message: 원격에서 내려받은 스크립트를 무결성 검증 없이 바로 셸로 실행합니다. 다운로드 후 체크섬 검증을 거쳐 실행해야 합니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    # 실행되는 명령만 잡고, 안내용 문자열 리터럴은 제외한다 (#19).
    # 설치 스크립트는 "지금 이 명령을 실행합니다" 를 출력한 뒤 실제로 실행하는 패턴이 흔해
    # 정탐 1건마다 오탐 1건이 따라붙었다. 두 겹으로 억제한다.
    #   1) 라인 선두가 출력 계열 명령(echo/printf/info/warn/log/...)이면 제외
    #   2) curl 앞의 구간이 "따옴표 밖" 이어야 한다 — 완결된 인용구만 건너뛸 수 있어
    #      열린 따옴표 안의 curl 에는 도달하지 못한다
    # 단 `bash -c "curl ... | sh"` 는 실제 실행이므로, 라인이 셸 실행 명령으로 시작하면
    # 2) 를 적용하지 않는다(첫 대안).
    pattern-regex: |-
      (?m)^(?!\s*#)(?:\s*(?:sudo\s+)?(?:bash|sh|zsh|dash|eval|ssh)\b[^\n]*?|(?!\s*(?:echo|printf|print|info|warn|warning|log|logger|error|debug|note|msg|say)\b)(?:[^"'\n]|"[^"\n]*"|'[^'\n]*')*?)\b(?:curl|wget)\b[^|\n]*\|\s*(?:sudo\s+)?(?:bash|sh|zsh|dash)\b

  - id: finguard.shell.eval-var
    languages: [regex]
    severity: WARNING
    message: eval 에 변수 확장이 포함되어 있습니다. 변수에 외부 입력이 닿으면 임의 명령 실행으로 이어집니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    pattern-regex: '(?m)^(?!\s*#).*\beval\s+[^\n#]*\$'

  - id: finguard.shell.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    pattern-regex: '(?im)^(?!\s*#).*\bhttp://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:www\.)?example\.(?:com|org)|purl\.org|iana\.org|ietf\.org)[^\s"'']+'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.shell.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.sh", "*.bash", "*.zsh"]
    pattern-regex: '(?im)^(?!\s*#).*\bws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:www\.)?example\.(?:com|org)|purl\.org|iana\.org|ietf\.org)[^\s"'']+'
