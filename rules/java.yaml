rules:
  # taint(오염 추적) 모드: 외부 입력이 검증 없이 SQL 인자에 도달할 때만 검출.
  # 내부 상수 조립은 잡지 않는다(오탐 제거, #7). 무료 CE 는 파일 내 추적까지.
  - id: finguard.java.jdbc-sqli
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 SQL 문에 도달합니다. PreparedStatement 바인딩을 사용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($SQL)
              - pattern: $S.executeUpdate($SQL)
              - pattern: $S.execute($SQL)
              - pattern: $S.addBatch($SQL)
              - pattern: $C.prepareStatement($SQL, ...)
              - pattern: $C.prepareCall($SQL, ...)
          - focus-metavariable: $SQL

  # 보조룰(비-taint): SQL 을 String.format/문자열 연결로 조립해 execute 계열에 넘기는 패턴.
  # jdbc-sqli 의 파일 단위 taint 가 Controller→DAO 파일 분리에서 끊기는 케이스를 보완한다.
  # 내부 상수만 조립하는 경우도 포함될 수 있어 severity=WARNING + 수동 확인 문구.
  # SQL 키워드가 포함된 리터럴로 한정해 오탐을 억제한다.
  - id: finguard.java.sql-string-build
    languages: [java]
    severity: WARNING
    message: SQL 문을 String.format 또는 문자열 연결로 조립해 실행하고 있습니다. 조립에 쓰인 값이 외부 입력에서 유래하면 SQL 삽입 위험이 있습니다. 파일 경계를 넘는 오염 추적은 자동 점검 범위를 벗어나므로 PreparedStatement 바인딩 여부를 수동 확인해야 합니다.
    paths:
      exclude: ["*Test.java"]
    patterns:
      - pattern-either:
          # (1) execute 인자에 String.format 직접
          - patterns:
              - pattern-either:
                  - pattern: $S.executeQuery(String.format($FMT, ...))
                  - pattern: $S.executeUpdate(String.format($FMT, ...))
                  - pattern: $S.execute(String.format($FMT, ...))
                  - pattern: $S.addBatch(String.format($FMT, ...))
              - metavariable-regex:
                  metavariable: $FMT
                  regex: (?is)^"?\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (2) 지역변수에 String.format 대입 후 execute
          - patterns:
              - pattern-either:
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.executeQuery($SQL);
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.executeUpdate($SQL);
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.execute($SQL);
              - metavariable-regex:
                  metavariable: $FMT
                  regex: (?is)^"?\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (3) execute 인자에 문자열 연결 직접 (SQL 리터럴 + 변수)
          - patterns:
              - pattern-either:
                  - pattern: $S.executeQuery($LIT + $X)
                  - pattern: $S.executeUpdate($LIT + $X)
                  - pattern: $S.execute($LIT + $X)
                  - pattern: $S.addBatch($LIT + $X)
              - metavariable-regex:
                  metavariable: $LIT
                  regex: (?is)^"\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (4) 지역변수에 문자열 연결 대입 후 execute
          - patterns:
              - pattern-either:
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.executeQuery($SQL);
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.executeUpdate($SQL);
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.execute($SQL);
              - metavariable-regex:
                  metavariable: $LIT
                  regex: (?is)^"\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)

  - id: finguard.java.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    patterns:
      - pattern-regex: '(?i)String\s+\w*(password|passwd|secret|apikey|api_key|appsecret)\w*\s*=\s*"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"]{4,}"'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'

  - id: finguard.java.weak-hash
    languages: [regex]
    severity: WARNING
    message: 취약한 해시 알고리즘(MD5/SHA-1)을 사용하고 있습니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: 'MessageDigest\.getInstance\(\s*"(MD5|SHA-?1)"'

  - id: finguard.java.weak-cipher
    languages: [regex]
    severity: ERROR
    message: 취약한 암호 알고리즘/운영모드(DES·RC4·ECB)를 사용하고 있습니다.
    # RSA/ECB/... 는 제외한다 — RSA 는 블록암호가 아니라 운영모드 개념이 없고,
    # 변환 문자열의 ECB 는 JCA 명명 규약상 자리를 채우는 토큰일 뿐이다.
    # RSA/ECB/OAEPWith... 는 오히려 권장되는 안전한 형식이다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: 'Cipher\.getInstance\(\s*"(DES|DESede|RC4|ARCFOUR)[^"]*"|Cipher\.getInstance\(\s*"(?!RSA/)[^"]+/ECB/|Cipher\.getInstance\(\s*"(?!RSA")[A-Za-z][A-Za-z0-9]*"'

  - id: finguard.java.print-sensitive
    languages: [regex]
    severity: WARNING
    message: 로그/콘솔에 중요정보가 출력될 수 있습니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*?(?:System\.out\.print(?:ln)?|printStackTrace|log(?:ger)?\.(?:info|debug|warn|error))\((?:"(?:\\.|[^"\\])*"|[^")])*?(?:\b(?:password|passwd|token|secret|cardno|card_no)\b|주민)'

  - id: finguard.java.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  - id: finguard.mybatis.dollar-interpolation
    languages: [regex]
    severity: ERROR
    message: MyBatis 매퍼에서 ${} 문자열 치환을 사용하고 있습니다. 외부 입력이 닿으면 SQL 삽입으로 이어지므로 #{} 바인딩을 사용해야 합니다.
    paths:
      include: ["*Mapper.xml", "*mapper.xml"]
    pattern-regex: '\$\{\s*[a-zA-Z_][\w.]*\s*\}'

  # ------------------------------------------------------------------
  # 1. OS 명령어 삽입 (CWE-78)
  # ------------------------------------------------------------------
  - id: finguard.java.os-command-injection
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 OS 명령 실행에 도달합니다. 명령어·인자를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($X, ...)
              - pattern: new ProcessBuilder($X, ...)
              - pattern: $PB.command($X, ...)
          - focus-metavariable: $X

  # ------------------------------------------------------------------
  # 2. LDAP 삽입 (CWE-90)
  # ------------------------------------------------------------------
  - id: finguard.java.ldap-injection
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 LDAP 검색 필터에 도달합니다. 필터 특수문자를 이스케이프하거나 바인딩 파라미터를 사용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CTX.search($BASE, $FILTER, ...)
              - pattern: $CTX.searchOne($BASE, $FILTER, ...)
          - focus-metavariable: $FILTER

  # ------------------------------------------------------------------
  # 3. XML 외부 엔티티 참조(XXE) (CWE-611)
  # ------------------------------------------------------------------
  - id: finguard.java.xxe
    languages: [java]
    severity: ERROR
    message: XML 파서를 외부 엔티티(DTD) 차단 설정 없이 생성하고 있습니다. disallow-doctype-decl 등 안전 설정을 적용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    pattern-either:
      # (a) 인라인 체인 — 안전설정을 넣을 기회 자체가 없으므로 무조건 검출
      - pattern: DocumentBuilderFactory.newInstance(...).newDocumentBuilder(...)
      - pattern: SAXParserFactory.newInstance(...).newSAXParser(...)
      - pattern: XMLInputFactory.newInstance(...).createXMLStreamReader(...)
      - pattern: XMLInputFactory.newInstance(...).createXMLEventReader(...)
      - pattern: TransformerFactory.newInstance(...).newTransformer(...)
      - pattern: new SAXReader().read(...)
      - pattern: new SAXBuilder().build(...)
      # (b) 변수에 담아 쓰는 경우 — 안전설정 호출이 뒤따르지 않을 때만 검출
      - patterns:
          - pattern-either:
              - pattern: $T $F = DocumentBuilderFactory.newInstance(...);
              - pattern: $T $F = SAXParserFactory.newInstance(...);
              - pattern: $T $F = XMLInputFactory.newInstance(...);
              - pattern: $T $F = XMLReaderFactory.createXMLReader(...);
              - pattern: $T $F = TransformerFactory.newInstance(...);
              - pattern: $T $F = SchemaFactory.newInstance(...);
              - pattern: $T $F = new SAXReader(...);
              - pattern: $T $F = new SAXBuilder(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setFeature(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setProperty(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setAttribute(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setExpandEntityReferences(false);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setXIncludeAware(false);

  # ------------------------------------------------------------------
  # 4. 인증서 검증 무력화 (CWE-295)
  # ------------------------------------------------------------------
  - id: finguard.java.insecure-trust-manager
    languages: [java]
    severity: ERROR
    message: 서버 인증서 또는 호스트명 검증을 무력화하고 있습니다. 중간자 공격에 노출되므로 정상 검증 로직을 구현해야 합니다.
    paths:
      exclude: ["*Test.java"]
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public void checkClientTrusted(...) { }
      - pattern: |
          public boolean verify(...) { return true; }
      - pattern: |
          public boolean isTrusted(...) { return true; }

  # ------------------------------------------------------------------
  # 5. 취약한 TLS 프로토콜 (CWE-326)
  # ------------------------------------------------------------------
  - id: finguard.java.weak-tls-protocol
    languages: [regex]
    severity: WARNING
    message: 취약한 TLS/SSL 프로토콜 버전을 지정하고 있습니다. TLSv1.2 이상을 사용해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(SSLContext|SSLEngine)\.getInstance\(\s*"(SSL|SSLv2|SSLv3|TLSv1|TLSv1\.1)"|setEnabledProtocols\(\s*new\s+String\[\]\s*\{[^}]*"(SSLv3|TLSv1|TLSv1\.1)"'

  # ------------------------------------------------------------------
  # 6. 오픈 리다이렉트 (CWE-601)
  # ------------------------------------------------------------------
  - id: finguard.java.open-redirect
    languages: [java]
    severity: WARNING
    message: 외부 입력이 검증 없이 리다이렉트 주소로 사용됩니다. 허용된 내부 경로 목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.sendRedirect($URL, ...)
              - pattern: new RedirectView($URL, ...)
          - focus-metavariable: $URL

  # ------------------------------------------------------------------
  # 7. 경로 조작 / 디렉터리 탐색 (CWE-22)
  # ------------------------------------------------------------------
  - id: finguard.java.path-traversal
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 파일 경로로 사용됩니다. 상위 경로(..) 제거 및 기준 디렉터리 검증이 필요합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - pattern: new File(...)
      - pattern: new FileInputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: new FileReader(...)
      - pattern: new FileWriter(...)
      - pattern: new RandomAccessFile(...)
      - pattern: Paths.get(...)
      - pattern: Files.newInputStream(...)
      - pattern: Files.newOutputStream(...)

  # zip-slip: 압축 엔트리명을 검증 없이 파일 경로로 사용 (CWE-22).
  # ZIP 엔트리명은 아카이브 제작자가 임의로 정할 수 있어 "../" 로 기준 디렉터리를
  # 탈출할 수 있다. 첨부파일(ZIP/HWPX/OOXML) 업로드 처리 경로에서 특히 위험하다.
  # 정규화 후 기준 경로 검증(startsWith)을 한 코드는 잡지 않는다.
  - id: finguard.java.zip-slip
    languages: [java]
    severity: ERROR
    message: 압축 엔트리명이 검증 없이 파일 경로로 사용되고 있습니다(zip-slip). 엔트리명은 아카이브 제작자가 정하므로 상위 경로(..)로 기준 디렉터리를 벗어날 수 있습니다. 정규화(getCanonicalPath) 후 기준 디렉터리 하위인지 확인해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $E.getName()
      - pattern: $E.getEntry(...).getName()
    pattern-sanitizers:
      # 정규화(canonical)·파일명만 추출한 경우는 안전으로 본다.
      # 정규화 뒤 기준 디렉터리 검증까지 하는 것이 정석이며, 정규화 자체를
      # sanitizer 로 보아 검증 코드를 오탐하지 않게 한다.
      - pattern: $P.getCanonicalPath()
      - pattern: $P.getCanonicalFile()
      - pattern: $P.toPath().normalize()
      - pattern: $P.normalize()
      - pattern: FilenameUtils.getName(...)
      - pattern: new File(...).getName()
    # sink 은 실제 파일 I/O 로 한정한다. new File()/Paths.get() 은 경로 객체 생성일
    # 뿐이라 그 자체로 위험하지 않고, sink 로 두면 검증 코드까지 잡는 오탐이 된다.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new FileOutputStream(...)
              - pattern: new FileWriter(...)
              - pattern: new RandomAccessFile(...)
              - pattern: Files.newOutputStream(...)
              - pattern: Files.copy(...)
              - pattern: Files.write(...)

  # ------------------------------------------------------------------
  # 8. 서버측 요청 위조(SSRF) (CWE-918)
  # ------------------------------------------------------------------
  - id: finguard.java.ssrf
    languages: [java]
    severity: WARNING
    message: 외부 입력이 검증 없이 서버측 HTTP 요청 주소로 사용됩니다. 대상 호스트를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new URL($U, ...)
              - pattern: URI.create($U)
              - pattern: new HttpGet($U)
              - pattern: new HttpPost($U)
              - pattern: $RT.getForObject($U, ...)
              - pattern: $RT.postForObject($U, ...)
              - pattern: $RT.exchange($U, ...)
          - focus-metavariable: $U

  # ------------------------------------------------------------------
  # 9. 서버측 템플릿/표현식 삽입(SSTI) (CWE-1336)
  # ------------------------------------------------------------------
  - id: finguard.java.ssti
    languages: [java]
    severity: ERROR
    message: 외부 입력이 서버측 표현식/템플릿으로 직접 평가됩니다. 원격 코드 실행으로 이어질 수 있어 입력을 표현식으로 사용해서는 안 됩니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $P.parseExpression($X, ...)
              - pattern: $E.evaluate($CTX, $W, $TAG, $X)
              - pattern: $E.evaluateExpression($X, ...)
          - focus-metavariable: $X
