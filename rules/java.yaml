rules:
  # taint(오염 추적) 모드: 외부 입력이 검증 없이 SQL 인자에 도달할 때만 검출.
  # 내부 상수 조립은 잡지 않는다(오탐 제거, #7). 무료 CE 는 파일 내 추적까지.
  - id: finguard.java.jdbc-sqli
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 SQL 문에 도달합니다. PreparedStatement 바인딩을 사용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($SQL)
              - pattern: $S.executeUpdate($SQL)
              - pattern: $S.execute($SQL)
              - pattern: $S.addBatch($SQL)
              - pattern: $C.prepareStatement($SQL, ...)
              - pattern: $C.prepareCall($SQL, ...)
          - focus-metavariable: $SQL

  # 보조룰(비-taint): SQL 을 String.format/문자열 연결로 조립해 execute 계열에 넘기는 패턴.
  # jdbc-sqli 의 파일 단위 taint 가 Controller→DAO 파일 분리에서 끊기는 케이스를 보완한다.
  # 내부 상수만 조립하는 경우도 포함될 수 있어 severity=WARNING + 수동 확인 문구.
  # SQL 키워드가 포함된 리터럴로 한정해 오탐을 억제한다.
  - id: finguard.java.sql-string-build
    languages: [java]
    severity: WARNING
    message: SQL 문을 String.format 또는 문자열 연결로 조립해 실행하고 있습니다. 조립에 쓰인 값이 외부 입력에서 유래하면 SQL 삽입 위험이 있습니다. 파일 경계를 넘는 오염 추적은 자동 점검 범위를 벗어나므로 PreparedStatement 바인딩 여부를 수동 확인해야 합니다.
    paths:
      exclude: ["*Test.java"]
    patterns:
      - pattern-either:
          # (1) execute 인자에 String.format 직접
          - patterns:
              - pattern-either:
                  - pattern: $S.executeQuery(String.format($FMT, ...))
                  - pattern: $S.executeUpdate(String.format($FMT, ...))
                  - pattern: $S.execute(String.format($FMT, ...))
                  - pattern: $S.addBatch(String.format($FMT, ...))
              - metavariable-regex:
                  metavariable: $FMT
                  regex: (?is)^"?\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (2) 지역변수에 String.format 대입 후 execute
          - patterns:
              - pattern-either:
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.executeQuery($SQL);
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.executeUpdate($SQL);
                  - pattern: |
                      $T $SQL = String.format($FMT, ...);
                      ...
                      $S.execute($SQL);
              - metavariable-regex:
                  metavariable: $FMT
                  regex: (?is)^"?\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (3) execute 인자에 문자열 연결 직접 (SQL 리터럴 + 변수)
          - patterns:
              - pattern-either:
                  - pattern: $S.executeQuery($LIT + $X)
                  - pattern: $S.executeUpdate($LIT + $X)
                  - pattern: $S.execute($LIT + $X)
                  - pattern: $S.addBatch($LIT + $X)
              - metavariable-regex:
                  metavariable: $LIT
                  regex: (?is)^"\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)
          # (4) 지역변수에 문자열 연결 대입 후 execute
          - patterns:
              - pattern-either:
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.executeQuery($SQL);
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.executeUpdate($SQL);
                  - pattern: |
                      $T $SQL = $LIT + $X;
                      ...
                      $S.execute($SQL);
              - metavariable-regex:
                  metavariable: $LIT
                  regex: (?is)^"\s*(select\b.*\bfrom\b|insert\s+into\b|update\b.*\bset\b|delete\s+from\b|merge\s+into\b)

  - id: finguard.java.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    patterns:
      # 식별자 어휘는 6개 언어 공통 목록이다 (#36). 단독 `key` 는 넣지 않는다.
      - pattern-regex: '(?i)String\s+\w*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*\s*=\s*"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"]{4,}"'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      # 값 전체가 플레이스홀더인 unquoted 스칼라도 억제한다 (#23).
      # 따옴표를 optional 로 푸는 대신 값 경계(줄 끝)로 앵커해 "값 전체가 플레이스홀더"라는
      # 원래 의미를 보존한다 — 무앵커 부분일치로 바꾸면 실키 안의 우연한 xxx·todo 까지 억제된다.
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      # 국내 샘플 코드의 표준 관용구인 한국어 안내문은 시크릿이 아니라 입력 지시문이다 (#23).
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'

  # 취약 해시 (CWE-328).
  #   - MessageDigest/Mac 직접 호출 외에, 알고리즘명을 문자열로 받는 사내 래퍼
  #     (CryptUtil.encrypt("MD5", ...) 류)와 DigestUtils.md5* 계열까지 본다 (#34).
  #     금융권 공용 CryptUtil/SignUtil 은 알고리즘명을 파라미터로 넘기는 구조가 표준에
  #     가까워, 정의부에는 리터럴이 없고(getInstance(algorithm)) 호출부에는 MessageDigest
  #     문자열이 없어 종전 패턴은 양쪽 다 보지 못했다.
  #   - 상수 선언형(static final String HASH_ALGORITHM = "MD5")도 본다. 알고리즘명을 상수로
  #     빼고 래퍼에 넘기는 형태가 호출부 정규식으로는 잡히지 않는 최빈 미탐이었다.
  #   - 함수명 휴리스틱을 필수로 둬서 임의 함수의 첫 인자 "MD5" 오탐을 막는다.
  #   - Kotlin 대응은 finguard.kotlin.weak-hash(#28)가 이미 담당한다.
  - id: finguard.java.weak-hash
    languages: [regex]
    severity: WARNING
    message: 취약한 해시 알고리즘(MD5/SHA-1)을 사용하고 있습니다. SHA-256 이상(서명은 HMAC-SHA256)을 사용해야 합니다. 알고리즘명을 문자열로 받는 공용 래퍼를 경유하는 호출도 포함됩니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?:MessageDigest|Mac)\.getInstance\(\s*"(?i:MD5|SHA-?1|HmacMD5|HmacSHA-?1)"|\b(?:DigestUtils|Hashing)\.(?:md5|sha1)\w*\s*\(|\b\w*(?i:digest|hash|encrypt|decrypt|sign|hmac|crypt)\w*\s*\(\s*"(?i:MD5|SHA-?1|HmacMD5|HmacSHA-?1)"|\b(?:static\s+final\s+String|final\s+String|String)\s+\w*(?i:alg|algorithm|digest|hash|hmac)\w*\s*=\s*"(?i:MD5|SHA-?1|HmacMD5|HmacSHA-?1)"'

  # 취약 암호 알고리즘 — 공용 래퍼 경유 호출·상수 선언형 (CWE-327) (#34).
  #
  # finguard.java.weak-cipher(ERROR)와 분리한 별도 룰이다. 이쪽은 "함수명 어휘 + 알고리즘
  # 리터럴" 이라는 휴리스틱 매치라, 원 룰과 같은 ERROR 를 매기면 오탐이 기본 게이트
  # (FINGUARD_BLOCK_ON=ERROR)로 머지를 직접 막는다. WARNING 으로 시작하고 승격은 실코드
  # 검증 후 별도 판단한다.
  #
  # 알려진 한계: 알고리즘명이 호출부에도 상수에도 리터럴로 나타나지 않고 설정/DB 에서
  # 주입되는 형태는 정적 분석으로 확정할 수 없다. 정의부(getInstance($ALG))에 INFO 룰을
  # 두는 안은 채택하지 않았다 — 잘 작성된 crypto 래퍼일수록 더 많이 발화하는 구조라
  # MR 인라인 코멘트의 신호 대 잡음비를 직접 훼손한다.
  - id: finguard.java.weak-cipher-wrapper
    languages: [regex]
    severity: WARNING
    message: 취약한 암호 알고리즘(DES·3DES·RC4·Blowfish) 이름이 암·복호화 함수의 인자 또는 알고리즘 상수로 지정돼 있습니다. 공용 래퍼를 경유하더라도 실제로 그 알고리즘이 사용됩니다. AES/GCM 등 인증 암호로 교체해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '\b\w*(?i:encrypt|decrypt|cipher|crypt|seal|unseal)\w*\s*\(\s*"(?i:DES|DESede|TripleDES|RC4|ARCFOUR|Blowfish)[^"]*"|\b(?:static\s+final\s+String|final\s+String|String)\s+\w*(?i:alg|algorithm|cipher|transformation)\w*\s*=\s*"(?i:DES|DESede|TripleDES|RC4|ARCFOUR|Blowfish)[^"]*"'

  - id: finguard.java.weak-cipher
    languages: [regex]
    severity: ERROR
    message: 취약한 암호 알고리즘/운영모드(DES·RC4·ECB)를 사용하고 있습니다.
    # RSA/ECB/... 는 제외한다 — RSA 는 블록암호가 아니라 운영모드 개념이 없고,
    # 변환 문자열의 ECB 는 JCA 명명 규약상 자리를 채우는 토큰일 뿐이다.
    # RSA/ECB/OAEPWith... 는 오히려 권장되는 안전한 형식이다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: 'Cipher\.getInstance\(\s*"(DES|DESede|RC4|ARCFOUR)[^"]*"|Cipher\.getInstance\(\s*"(?!RSA/)[^"]+/ECB/|Cipher\.getInstance\(\s*"(?!RSA")[A-Za-z][A-Za-z0-9]*"'

  - id: finguard.java.print-sensitive
    languages: [regex]
    severity: WARNING
    message: 로그/콘솔에 중요정보가 출력될 수 있습니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*?(?:System\.out\.print(?:ln)?|printStackTrace|log(?:ger)?\.(?:info|debug|warn|error))\((?:"(?:\\.|[^"\\])*"|[^")])*?(?:\b(?:password|passwd|token|secret|cardno|card_no)\b|주민)'

  - id: finguard.java.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.java.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*"ws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org)[^"]+"'

  - id: finguard.mybatis.dollar-interpolation
    languages: [regex]
    severity: ERROR
    message: MyBatis 매퍼에서 ${} 문자열 치환을 사용하고 있습니다. 외부 입력이 닿으면 SQL 삽입으로 이어지므로 #{} 바인딩을 사용해야 합니다.
    paths:
      include: ["*Mapper.xml", "*mapper.xml"]
    pattern-regex: '\$\{\s*[a-zA-Z_][\w.]*\s*\}'

  # ------------------------------------------------------------------
  # 1. OS 명령어 삽입 (CWE-78)
  # ------------------------------------------------------------------
  - id: finguard.java.os-command-injection
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 OS 명령 실행에 도달합니다. 명령어·인자를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($X, ...)
              - pattern: new ProcessBuilder($X, ...)
              - pattern: $PB.command($X, ...)
          - focus-metavariable: $X

  # ------------------------------------------------------------------
  # 2. LDAP 삽입 (CWE-90)
  # ------------------------------------------------------------------
  - id: finguard.java.ldap-injection
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 LDAP 검색 필터에 도달합니다. 필터 특수문자를 이스케이프하거나 바인딩 파라미터를 사용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CTX.search($BASE, $FILTER, ...)
              - pattern: $CTX.searchOne($BASE, $FILTER, ...)
          - focus-metavariable: $FILTER

  # ------------------------------------------------------------------
  # 3. XML 외부 엔티티 참조(XXE) (CWE-611)
  # ------------------------------------------------------------------
  - id: finguard.java.xxe
    languages: [java]
    severity: ERROR
    message: XML 파서를 외부 엔티티(DTD) 차단 설정 없이 생성하고 있습니다. disallow-doctype-decl 등 안전 설정을 적용해야 합니다.
    paths:
      exclude: ["*Test.java"]
    pattern-either:
      # (a) 인라인 체인 — 안전설정을 넣을 기회 자체가 없으므로 무조건 검출
      - pattern: DocumentBuilderFactory.newInstance(...).newDocumentBuilder(...)
      - pattern: SAXParserFactory.newInstance(...).newSAXParser(...)
      - pattern: XMLInputFactory.newInstance(...).createXMLStreamReader(...)
      - pattern: XMLInputFactory.newInstance(...).createXMLEventReader(...)
      - pattern: TransformerFactory.newInstance(...).newTransformer(...)
      - pattern: new SAXReader().read(...)
      - pattern: new SAXBuilder().build(...)
      # (b) 변수에 담아 쓰는 경우 — 안전설정 호출이 뒤따르지 않을 때만 검출
      - patterns:
          - pattern-either:
              - pattern: $T $F = DocumentBuilderFactory.newInstance(...);
              - pattern: $T $F = SAXParserFactory.newInstance(...);
              - pattern: $T $F = XMLInputFactory.newInstance(...);
              - pattern: $T $F = XMLReaderFactory.createXMLReader(...);
              - pattern: $T $F = TransformerFactory.newInstance(...);
              - pattern: $T $F = SchemaFactory.newInstance(...);
              - pattern: $T $F = new SAXReader(...);
              - pattern: $T $F = new SAXBuilder(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setFeature(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setProperty(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setAttribute(...);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setExpandEntityReferences(false);
          - pattern-not-inside: |
              $T $F = $INIT;
              ...
              $F.setXIncludeAware(false);

  # ------------------------------------------------------------------
  # 4. 인증서 검증 무력화 (CWE-295)
  # ------------------------------------------------------------------
  - id: finguard.java.insecure-trust-manager
    languages: [java]
    severity: ERROR
    message: 서버 인증서 또는 호스트명 검증을 무력화하고 있습니다. 중간자 공격에 노출되므로 정상 검증 로직을 구현해야 합니다.
    paths:
      exclude: ["*Test.java"]
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public void checkClientTrusted(...) { }
      - pattern: |
          public boolean verify(...) { return true; }
      - pattern: |
          public boolean isTrusted(...) { return true; }

  # ------------------------------------------------------------------
  # 5. 취약한 TLS 프로토콜 (CWE-326)
  # ------------------------------------------------------------------
  - id: finguard.java.weak-tls-protocol
    languages: [regex]
    severity: WARNING
    message: 취약한 TLS/SSL 프로토콜 버전을 지정하고 있습니다. TLSv1.2 이상을 사용해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    pattern-regex: '(SSLContext|SSLEngine)\.getInstance\(\s*"(SSL|SSLv2|SSLv3|TLSv1|TLSv1\.1)"|setEnabledProtocols\(\s*new\s+String\[\]\s*\{[^}]*"(SSLv3|TLSv1|TLSv1\.1)"'

  # ------------------------------------------------------------------
  # 6. 오픈 리다이렉트 (CWE-601)
  # ------------------------------------------------------------------
  - id: finguard.java.open-redirect
    languages: [java]
    severity: WARNING
    message: 외부 입력이 검증 없이 리다이렉트 주소로 사용됩니다. 허용된 내부 경로 목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.sendRedirect($URL, ...)
              - pattern: new RedirectView($URL, ...)
          - focus-metavariable: $URL

  # ------------------------------------------------------------------
  # 7. 경로 조작 / 디렉터리 탐색 (CWE-22)
  # ------------------------------------------------------------------
  - id: finguard.java.path-traversal
    languages: [java]
    severity: ERROR
    message: 외부 입력이 검증 없이 파일 경로로 사용됩니다. 상위 경로(..) 제거 및 기준 디렉터리 검증이 필요합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - pattern: new File(...)
      - pattern: new FileInputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: new FileReader(...)
      - pattern: new FileWriter(...)
      - pattern: new RandomAccessFile(...)
      - pattern: Paths.get(...)
      - pattern: Files.newInputStream(...)
      - pattern: Files.newOutputStream(...)

  # zip-slip: 압축 엔트리명을 검증 없이 파일 경로로 사용 (CWE-22).
  # ZIP 엔트리명은 아카이브 제작자가 임의로 정할 수 있어 "../" 로 기준 디렉터리를
  # 탈출할 수 있다. 첨부파일(ZIP/HWPX/OOXML) 업로드 처리 경로에서 특히 위험하다.
  # 정규화 후 기준 경로 검증(startsWith)을 한 코드는 잡지 않는다.
  - id: finguard.java.zip-slip
    languages: [java]
    severity: ERROR
    message: 압축 엔트리명이 검증 없이 파일 경로로 사용되고 있습니다(zip-slip). 엔트리명은 아카이브 제작자가 정하므로 상위 경로(..)로 기준 디렉터리를 벗어날 수 있습니다. 정규화(getCanonicalPath) 후 기준 디렉터리 하위인지 확인해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      - pattern: $E.getName()
      - pattern: $E.getEntry(...).getName()
    pattern-sanitizers:
      # 정규화(canonical)·파일명만 추출한 경우는 안전으로 본다.
      # 정규화 뒤 기준 디렉터리 검증까지 하는 것이 정석이며, 정규화 자체를
      # sanitizer 로 보아 검증 코드를 오탐하지 않게 한다.
      - pattern: $P.getCanonicalPath()
      - pattern: $P.getCanonicalFile()
      - pattern: $P.toPath().normalize()
      - pattern: $P.normalize()
      - pattern: FilenameUtils.getName(...)
      - pattern: new File(...).getName()
    # sink 은 실제 파일 I/O 로 한정한다. new File()/Paths.get() 은 경로 객체 생성일
    # 뿐이라 그 자체로 위험하지 않고, sink 로 두면 검증 코드까지 잡는 오탐이 된다.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new FileOutputStream(...)
              - pattern: new FileWriter(...)
              - pattern: new RandomAccessFile(...)
              - pattern: Files.newOutputStream(...)
              - pattern: Files.copy(...)
              - pattern: Files.write(...)

  # ------------------------------------------------------------------
  # 8. 서버측 요청 위조(SSRF) (CWE-918)
  # ------------------------------------------------------------------
  - id: finguard.java.ssrf
    languages: [java]
    severity: WARNING
    message: 외부 입력이 검증 없이 서버측 HTTP 요청 주소로 사용됩니다. 대상 호스트를 허용목록으로 제한해야 합니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new URL($U, ...)
              - pattern: URI.create($U)
              - pattern: new HttpGet($U)
              - pattern: new HttpPost($U)
              - pattern: $RT.getForObject($U, ...)
              - pattern: $RT.postForObject($U, ...)
              - pattern: $RT.exchange($U, ...)
          - focus-metavariable: $U

  # ------------------------------------------------------------------
  # 9. 서버측 템플릿/표현식 삽입(SSTI) (CWE-1336)
  # ------------------------------------------------------------------
  - id: finguard.java.ssti
    languages: [java]
    severity: ERROR
    message: 외부 입력이 서버측 표현식/템플릿으로 직접 평가됩니다. 원격 코드 실행으로 이어질 수 있어 입력을 표현식으로 사용해서는 안 됩니다.
    paths:
      exclude: ["*Test.java"]
    mode: taint
    pattern-sources:
      # (a) Servlet 원시 API
      - pattern: $R.getParameter(...)
      - pattern: $R.getParameterValues(...)
      - pattern: $R.getHeader(...)
      - pattern: $R.getQueryString()
      - pattern: $R.getCookies()
      # (b) Spring MVC 컨트롤러 파라미터 애노테이션 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@RequestBody $T $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $RT $M(..., @RequestBody(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestParam(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @PathVariable(...) $T $X, ...) { ... } }"
              - pattern: "class $C { $RT $M(..., @RequestHeader(...) $T $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $P.parseExpression($X, ...)
              - pattern: $E.evaluate($CTX, $W, $TAG, $X)
              - pattern: $E.evaluateExpression($X, ...)
          - focus-metavariable: $X

  # ------------------------------------------------------------------
  # 10. 개발용 인증 우회 엔드포인트 — 자격증명 검증 없이 토큰 발급 (CWE-489) (#37)
  # ------------------------------------------------------------------
  # 여러 줄에 걸친 AND 조건(매핑 애노테이션 경로 어휘 + 같은 메서드 본문의 토큰 발급 호출)이라
  # 정규식으로는 표현할 수 없어 semantic 모드로 구성했다. Kotlin 문법(fun ...)을 같은 룰에
  # 섞으면 Java 파서가 파싱 에러를 내므로 languages 는 [java] 단일로 둔다 — Kotlin 대응은
  # finguard.kotlin.dev-backdoor-endpoint(#28)가 이미 담당한다.
  #
  # 억제 사유로 인정하지 않는 것: @Profile("!prod") · 런타임 isProdProfile() 게이트.
  # 그 게이트는 인터넷에 공개된 staging/검증계에서는 무효라 실제 사고의 유일한(그리고
  # 뚫린) 방어선이었다.
  #
  # 경로 어휘는 "세그먼트" 단위로만 인정한다(/dev/, /local-login/). 부분문자열 매칭이면
  # /api/v1/devices 같은 정상 경로가 걸린다.
  - id: finguard.java.dev-auth-endpoint
    languages: [java]
    severity: WARNING
    message: |
      개발·로컬 전용으로 보이는 경로에서 자격증명 검증 없이 토큰을 발급하고 있습니다. 프로파일 조건(@Profile("!prod")·isProdProfile())만으로는 외부망에 노출된 검증계/개발계를 막지 못합니다. 운영 빌드에서 엔드포인트를 제거하거나(빌드·프로파일 분리), 실제 자격증명 검증을 추가하거나, 네트워크 계층에서 접근을 차단해야 합니다. 이미 그런 완화를 적용했다면 대상 레포의 .finguard.yml `ignore` 에 해당 파일을 명시해 승인 사실을 남기십시오.
    paths:
      exclude: ["*Test.java"]
    patterns:
      # (A) 개발·로컬 어휘가 경로 세그먼트로 들어간 매핑 애노테이션이 붙은 메서드 안일 것
      - pattern-either:
          # @PostMapping("/dev/login") — 인자 하나짜리 축약형
          - patterns:
              - pattern-inside: |
                  @$ANN($PATH)
                  $RT $M(...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: '^(?:Get|Post|Put|Patch|Delete|Request)Mapping$'
              - metavariable-regex:
                  metavariable: $PATH
                  regex: '(?i)^"(?:[^"]*/)?(?:dev|develop|local|test|debug|stub|mock|impersonate|switch-?user|su)(?:[-_]\w+)*(?:/[^"]*)?"$'
          # @RequestMapping(value = "/debug/switch-user", method = ...) — 명시 인자형
          - patterns:
              - pattern-inside: |
                  @$ANN(value = $PATH, ...)
                  $RT $M(...) { ... }
              - metavariable-regex:
                  metavariable: $ANN
                  regex: '^(?:Get|Post|Put|Patch|Delete|Request)Mapping$'
              - metavariable-regex:
                  metavariable: $PATH
                  regex: '(?i)^"(?:[^"]*/)?(?:dev|develop|local|test|debug|stub|mock|impersonate|switch-?user|su)(?:[-_]\w+)*(?:/[^"]*)?"$'
      # (B) 같은 메서드 본문에 토큰 발급 호출이 있을 것 — 코멘트는 이 줄에 달린다
      - pattern-either:
          - pattern: $X.generateAccessToken(...)
          - pattern: $X.createAccessToken(...)
          - pattern: $X.generateRefreshToken(...)
          - pattern: $X.createRefreshToken(...)
          - pattern: $X.generateToken(...)
          - pattern: $X.createToken(...)
          - pattern: $X.issueToken(...)
          # 제공자 객체 이름에 Jwt/Token 이 들어간 경우의 일반 발급 메서드
          - patterns:
              - pattern-either:
                  - pattern: $P.generate(...)
                  - pattern: $P.create(...)
                  - pattern: $P.issue(...)
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?i)\w*(?:jwt|token)\w*'

  # ------------------------------------------------------------------
  # 11. 외부 연동 HTTP 클라이언트 전체 로깅 (CWE-532) (#32)
  # ------------------------------------------------------------------
  # 기존 로그 룰(finguard.java.print-sensitive)은 호출부 인자의 어휘만 보므로, 설정 한 줄로
  # 모든 요청·응답 헤더와 본문을 흘리는 구조를 원리적으로 볼 수 없다. Feign Logger.Level.FULL
  # 이 BasicAuth/Bearer 인터셉터와 결합하면 연동 시크릿이 담긴 Authorization 헤더와 결제 승인
  # 응답 본문이 그대로 로그에 남는다.
  #
  # severity 는 WARNING 이다. FULL/BODY 로깅은 `if (BuildConfig.DEBUG)`·@Profile("local") 로
  # 감싸인 경우가 흔한데 정규식은 그 감쌈을 보지 못한다 — ERROR 로 두면 기본 게이트
  # (FINGUARD_BLOCK_ON=ERROR)가 로컬 전용 설정에 걸려 머지를 막는다.
  # "같은 설정 클래스에 인증 헤더 인터셉터가 등록된 경우만 ERROR 승격" 은 semgrep 단독으로
  # 판정할 수 없어(등록이 다른 파일에 있을 수 있다) 룰이 아니라 매핑 explain 의 일반 지침으로 옮겼다.
  #
  # paths 는 *.java 만이다. Kotlin 은 finguard.kotlin.feign-full-logging(#28)이 이미 담당한다 —
  # 여기에 *.kt 를 넣으면 같은 줄에 코멘트가 두 번 달린다.
  - id: finguard.java.http-client-full-logging
    languages: [regex]
    severity: WARNING
    message: 외부 연동 HTTP 클라이언트가 요청·응답을 통째로 로깅하도록 설정돼 있습니다. 헤더와 본문이 그대로 로그에 남아 연동 자격증명(Authorization)과 결제·계좌 응답이 노출됩니다. 로깅 레벨을 BASIC 이하로 낮추거나 민감 헤더·본문을 마스킹해야 합니다.
    paths:
      include: ["*.java"]
      exclude: ["*Test.java"]
    patterns:
      - pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*(?:\bLogger\.Level\.(?:FULL|HEADERS)\b|\bHttpLoggingInterceptor\.Level\.(?:BODY|HEADERS)\b|\bsetLevel\s*\(\s*(?:HttpLoggingInterceptor\.)?(?:Level\.)?(?:FULL|BODY)\s*\)|org\.apache\.http\.wire)'
      # org.apache.http.wire 로거를 *끄는* 설정은 오히려 수정된 코드다.
      # pattern-not-regex 는 검출 범위를 포함할 때만 억제되므로 줄 전체를 잡는다.
      - pattern-not-regex: '(?im)^.*org\.apache\.http\.wire.*\b(?:OFF|ERROR|WARN|NONE|BASIC)\b.*$'
