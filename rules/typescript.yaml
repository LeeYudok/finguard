rules:
  - id: finguard.ts.dangerously-set-inner-html
    languages: [regex]
    severity: WARNING
    message: dangerouslySetInnerHTML 은 XSS 위험이 있습니다. 신뢰할 수 없는 입력이 섞이지 않는지 확인해야 합니다.
    paths:
      include: ["*.tsx", "*.jsx"]
    pattern-regex: '\bdangerouslySetInnerHTML\b'

  - id: finguard.ts.eval
    languages: [regex]
    severity: ERROR
    message: eval/new Function 은 임의 코드 실행으로 이어질 수 있습니다.
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
    pattern-regex: '\b(eval|new\s+Function)\s*\('

  # 식별자 어휘·억제는 7개 언어 공통 목록이다 (#36·#23). TS 만 #29 의 파일 소유권 충돌로
  # 이식에서 빠져 있었다 (#70). 단독 `key` 는 넣지 않는다 — map key·헤더명으로 오탐이
  # 폭증한다. app_secret·client_secret 은 `secret` 이, apikey 는 `api[_-]?key` 가 이미
  # 포섭하므로 중복 항목은 두지 않는다.
  #
  # TS 고유 구문 3가지를 다른 언어판에 덧붙였다.
  #  (1) 선언 키워드(const/let/var) 요구를 없앴다 — 객체 리터럴 프로퍼티
  #      (`{ apiKey: "..." }`)·클래스 필드·헤더 맵(`"X-Api-Key": "..."`)이 전부 미탐이었다.
  #  (2) 타입 주석을 건너뛴다 — `const password: string = "..."` 는 식별자 바로 뒤가
  #      `=` 가 아니라 `:` 라 다른 언어판 정규식으로는 잡히지 않는다.
  #  (3) `===`/`==` 비교식도 본다 — 하드코드 자격증명과의 동등 비교는 그 자체가 검출 대상이다.
  #
  # 백틱(템플릿 리터럴)은 의도적으로 제외했다 — `` `Bearer ${token}` `` 같은 보간 문자열이
  # 값 자리에 그대로 들어와 오탐이 된다. 보간 여부 판정을 붙일 때 별도로 다룬다.
  - id: finguard.ts.hardcoded-secret
    languages: [regex]
    severity: ERROR
    message: 소스코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다.
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
      exclude: ["*.test.ts", "*.spec.ts", "*.test.tsx", "*.spec.tsx", "*.test.js", "*.spec.js", "*.test.jsx", "*.spec.jsx", "**/test/**", "**/tests/**", "**/__tests__/**", "test_*.ts", "test_*.tsx", "test_*.js", "test_*.jsx"]
    patterns:
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*["'']?\s*(?::\s*[\w<>\[\].|?]+\s*)?[:=]{1,3}\s*(?:"(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"%/{][^"]{7,}"|''(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+'')(?![a-z]+(?:_[a-z]+)+'')[^''%/{][^'']{7,}'')'
      # 마스킹 플레이스홀더는 시크릿이 아니다 — 오히려 가리는 코드다
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      # 값 전체가 플레이스홀더인 unquoted 스칼라도 억제한다 (#23).
      # 따옴표를 optional 로 푸는 대신 값 경계(줄 끝)로 앵커해 "값 전체가 플레이스홀더"라는
      # 원래 의미를 보존한다 — 무앵커 부분일치로 바꾸면 실키 안의 우연한 xxx·todo 까지 억제된다.
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      # 국내 샘플 코드의 표준 관용구인 한국어 안내문은 시크릿이 아니라 입력 지시문이다 (#23).
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'

  # 테스트 코드 시크릿 (#25 의 이원화 정책을 TS 에 적용 — #70).
  # 운영 룰과 어휘·억제는 같고 값 형태 조건만 강하다(길이·문자 구성이 실제 자격증명 형태일 때만).
  # 테스트 픽스처의 "pw1234"·"test-password" 같은 값으로 도구가 못 쓰게 되는 것을 막는다.
  # 대상은 파일명 규약(`*.test.ts`·`*.spec.ts` 계열)만 본다 — `__tests__/` 디렉터리 규약은
  # 픽스처 디렉터리가 평평해서(#60) 회귀 테스트로 고정할 수 없어 이번 범위에서 뺐다.
  # 그 경로의 파일은 종전대로 운영 룰이 덮는다.
  - id: finguard.ts.hardcoded-secret-test
    languages: [regex]
    severity: ERROR
    message: 테스트 코드에 비밀정보(비밀번호·API 키·토큰)가 하드코드되어 있습니다. 저장소와 git 히스토리에 그대로 남으므로 운영 코드와 동일하게 제거·회전해야 합니다.
    paths:
      include: ["*.test.ts", "*.spec.ts", "*.test.tsx", "*.spec.tsx", "*.test.js", "*.spec.js", "*.test.jsx", "*.spec.jsx", "**/test/**", "**/tests/**", "**/__tests__/**", "test_*.ts", "test_*.tsx", "test_*.js", "test_*.jsx"]
    patterns:
      - pattern-regex: '(?i)\b\w*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|credential|passphrase|private[_-]?key|signing[_-]?key|encrypt(?:ion)?[_-]?key|master[_-]?key|aes[_-]?key|hmac[_-]?key)\w*["'']?\s*(?::\s*[\w<>\[\].|?]+\s*)?[:=]{1,3}\s*(?:"(?=[0-9]{12,}|[A-Za-z0-9+/=_.\-]{16,}|(?=[^"]{12,})(?=[^"]*[A-Za-z])(?=[^"]*[0-9]))(?!https?://)(?!jdbc:)(?!(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)")(?!(?-i:[a-z]+(?:_[a-z]+)+)")[^"%/{][^"]{7,}"|''(?=[0-9]{12,}|[A-Za-z0-9+/=_.\-]{16,}|(?=[^'']{12,})(?=[^'']*[A-Za-z])(?=[^'']*[0-9]))(?!https?://)(?!jdbc:)(?![A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+'')(?![a-z]+(?:_[a-z]+)+'')[^''%/{][^'']{7,}'')'
      - pattern-not-regex: '(?i)["''`](\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|<[^>]*redact[^>]*>|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]|[:=]\s*(\*{3,}|•{3,}|#{3,})(?![\w-])'
      - pattern-not-regex: '(?im)^[ \t]*(?:export[ \t]+)?(-[ \t]+)?["'']?[\w.-]+["'']?[ \t]*[:=][ \t]*["''`]?(\*{3,}|x{3,}|•{3,}|\.{4,}|#{3,}|_{4,}|redacted|change[_-]?me|placeholder|dummy|your[_-][\w-]*|todo|fixme)["''`]?[ \t]*[,;)]*[ \t]*(?:#.*|//.*)?$'
      - pattern-not-regex: '(?im)^[^\n]*[:=][ \t]*["''`]?[^"''`\n]*(입력[ \t]*(?:하세요|해[ \t]*주세요|해주세요|바랍니다|하십시오)|여기에?[ \t]*입력|발급[ \t]*받은|본인의|자신의|예시|샘플)[^\n]*$'

  - id: finguard.ts.http-url
    languages: [regex]
    severity: WARNING
    message: 평문 HTTP URL 이 사용되고 있습니다. TLS(https) 로 전환해야 합니다.
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
    # 평문 http 리터럴 검출. 단 XML 네임스페이스 URI(통신 주소가 아니라 스키마 식별자)는
    # 제외한다 — 같은 줄에 xmlns 가 있거나, 잘 알려진 문서포맷 스키마 호스트(w3/apache/idpf/
    # hancom/openxmlformats 등)인 경우. HWPX·OOXML·EPUB 은 XML 기반이라 네임스페이스가 도배된다.
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*))(?!.*\bxmlns\b).*["'']http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org|(?:www\.)?hancom\.(?:co\.kr|com)|(?:www\.)?idpf\.org|openxmlformats\.org|(?:www\.)?oasis-open\.org|dublincore\.org|docbook\.org)[^"'']+["'']'

  # 금융 실시간 채널(시세·체결통보)은 대부분 웹소켓이고 접속키가 함께 흐른다 (#30).
  # http-url 과 스킴만 다르고 예외 도메인 목록은 동일 — ws://localhost 개발 서버는 계속 제외된다.
  # 접속 자격증명 동반 가능성이 높아 severity 는 ERROR 로 분리했다(http-url 은 WARNING 유지).
  - id: finguard.ts.cleartext-websocket
    languages: [regex]
    severity: ERROR
    message: 평문 WebSocket(ws://) 으로 통신하고 있습니다. 실시간 시세·체결통보 채널에는 접속키와 거래내역이 흐르므로 wss:// 로 전환해야 합니다.
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
    # 평문 http 리터럴 검출. 단 XML 네임스페이스 URI(통신 주소가 아니라 스키마 식별자)는
    # 제외한다 — 같은 줄에 xmlns 가 있거나, 잘 알려진 문서포맷 스키마 호스트(w3/apache/idpf/
    # hancom/openxmlformats 등)인 경우. HWPX·OOXML·EPUB 은 XML 기반이라 네임스페이스가 도배된다.
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*))(?!.*\bxmlns\b).*["'']ws://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|schemas\.|xmlns|(?:www\.)?w3\.org|(?:[\w.]+\.)?apache\.org|[\w.]*xml\.org|java\.sun\.com|(?:www\.)?example\.(?:com|org)|(?:www\.)?unicode\.org|(?:www\.)?jflex\.de|purl\.org|iana\.org|ietf\.org|slf4j\.org|json-schema\.org|(?:www\.)?hancom\.(?:co\.kr|com)|(?:www\.)?idpf\.org|openxmlformats\.org|(?:www\.)?oasis-open\.org|dublincore\.org|docbook\.org)[^"'']+["'']'

  - id: finguard.ts.os-command-injection
    languages: [ts, js]
    severity: ERROR
    message: 외부 입력이 OS 명령 실행 함수로 전달되고 있습니다. 명령어 문자열 조합 대신 execFile/spawn 의 인자 배열을 사용해야 합니다.
    metadata:
      cwe: "CWE-78"
      category: security
    mode: taint
    pattern-sources:
      # (a) Express 스타일 요청 객체
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.headers
      # (b) NestJS·nestia 컨트롤러 파라미터 데코레이터 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@Body() $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 후속 사용처로 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X()` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $M(..., @Body(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Query(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Param(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Headers(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @EncryptedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.EncryptedBody(...) $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: $CP.spawn($CMD, ...)
              - pattern: $CP.spawnSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: spawn($CMD, ...)
          - focus-metavariable: $CMD

  - id: finguard.ts.open-redirect
    languages: [ts, js]
    severity: WARNING
    message: 외부 입력이 리다이렉트 대상 URL 로 사용되고 있습니다. 허용 목록(allowlist) 또는 내부 경로로 제한해야 합니다.
    metadata:
      cwe: "CWE-601"
      category: security
    mode: taint
    pattern-sources:
      # (a) Express 스타일 요청 객체
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.headers
      # (b) NestJS·nestia 컨트롤러 파라미터 데코레이터 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@Body() $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 후속 사용처로 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X()` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $M(..., @Body(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Query(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Param(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Headers(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @EncryptedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.EncryptedBody(...) $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL)
              - pattern: $RES.redirect($CODE, $URL)
          - focus-metavariable: $URL

  - id: finguard.ts.ssrf
    languages: [ts, js]
    severity: WARNING
    message: 외부 입력이 서버 측 HTTP 요청 대상 URL 로 사용되고 있습니다(SSRF). 호스트 허용 목록으로 제한해야 합니다.
    metadata:
      cwe: "CWE-918"
      category: security
    mode: taint
    pattern-sources:
      # (a) Express 스타일 요청 객체
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.headers
      # (b) NestJS·nestia 컨트롤러 파라미터 데코레이터 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@Body() $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 후속 사용처로 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X()` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $M(..., @Body(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Query(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Param(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Headers(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @EncryptedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.EncryptedBody(...) $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($U, ...)
              - pattern: axios($U, ...)
              - pattern: axios.get($U, ...)
              - pattern: axios.post($U, ...)
              - pattern: axios.request($U, ...)
              - pattern: http.get($U, ...)
              - pattern: http.request($U, ...)
              - pattern: https.get($U, ...)
              - pattern: https.request($U, ...)
          - focus-metavariable: $U

  # 2차(stored) SSRF — 외부에서 지정한 콜백/웹훅 URL 이 DB 를 경유해 저장된 뒤 서버가 호출하는 경로 (#29).
  # ts.ssrf 의 taint 로는 못 잡는다. 이유가 두 가지고 둘 다 실측했다:
  #   (1) 값이 Prisma/ORM 을 거쳐 저장·재조회되므로 taint 체인이 끊긴다.
  #   (2) semgrep 1.169.0 의 TS 파서는 `export namespace X { ... }` 블록 안의 문장을
  #       AST 패턴으로 매칭하지 못한다(같은 코드가 top-level 이면 매칭됨 — 실측).
  #       provider 를 export namespace 로 감싸는 코드베이스에서는 sink 자체가 무음이라
  #       source 를 아무리 넓혀도 소용이 없다. 그래서 이 룰만 languages: [regex] 로 둔다.
  # 오탐 억제: 임의의 비리터럴 URL 이 아니라 "webhook/callback/postback/notify/redirect/forward"
  # 어휘 + url/uri/endpoint 로 끝나는 **프로퍼티 접근**(엔티티 필드 읽기)일 때만 발화한다.
  # SCREAMING_CASE 필드(`Config.WEBHOOK_URL` 같은 설정 상수)는 대소문자 구분으로 제외한다.
  # 확정 취약점이 아니라 "출처 확인 필요" 신호이므로 severity 는 WARNING 으로 둔다.
  - id: finguard.ts.stored-ssrf
    languages: [regex]
    severity: WARNING
    message: 외부에서 지정한 콜백/웹훅 URL 필드가 서버 측 HTTP 요청 대상으로 사용되고 있습니다(2차 SSRF). 저장 시점에 호스트 허용 목록·사설 IP 대역 차단으로 검증했는지 확인해야 합니다.
    metadata:
      cwe: "CWE-918"
      category: security
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
      exclude: ["*.test.ts", "*.spec.ts", "*.test.js", "*.spec.js"]
    pattern-regex: '(?m)^(?![ \t]*(?://|\*|/\*)).*\b(?:fetch|axios(?:\.(?:get|post|put|patch|delete|head|request))?|https?\.(?:get|request))\s*\(\s*(?:await\s+)?[A-Za-z_$][\w$]*(?:\s*\??\.\s*[\w$]+)*\s*\??\.\s*[\w$]*(?:webhook|Webhook|callback|Callback|postback|Postback|notify|Notify|redirect|Redirect|forward|Forward)[\w$]*(?:url|Url|URL|uri|Uri|URI|endpoint|Endpoint)[\w$]*\s*!?\s*[,)]'

  - id: finguard.ts.xss-innerhtml
    languages: [ts, js]
    severity: WARNING
    message: DOM 에 HTML 문자열을 직접 주입하고 있습니다(XSS). textContent 사용 또는 출력값 이스케이프/살균이 필요합니다.
    metadata:
      cwe: "CWE-79"
      category: security
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - pattern: document.write($X)
          - pattern: document.writeln($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")
      - pattern-not: document.writeln("...")
      - pattern-not: $EL.innerHTML = ""

  - id: finguard.ts.path-traversal
    languages: [ts, js]
    severity: ERROR
    message: 외부 입력이 파일 경로로 사용되고 있습니다(경로 조작). path.basename 등으로 정규화하고 기준 디렉터리 밖 접근을 차단해야 합니다.
    metadata:
      cwe: "CWE-22"
      category: security
    mode: taint
    pattern-sources:
      # (a) Express 스타일 요청 객체
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.headers
      # (b) NestJS·nestia 컨트롤러 파라미터 데코레이터 (#29).
      #     메서드 시그니처 전체를 감싸고 focus-metavariable 로 파라미터를 지목해야
      #     taint 가 실제로 전파된다. bare `@Body() $X` 는 --validate 는 통과하지만
      #     파라미터 선언 노드만 매치할 뿐 오염이 후속 사용처로 흐르지 않아 0건이 된다
      #     (semgrep 1.169.0 실측). `@X(...)` 는 인자 없는 `@X()` 도 함께 매칭한다.
      - patterns:
          - pattern-either:
              - pattern: "class $C { $M(..., @Body(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Query(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Param(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @Headers(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @EncryptedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedBody(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedQuery(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.TypedParam(...) $X, ...) { ... } }"
              - pattern: "class $C { $M(..., @core.EncryptedBody(...) $X, ...) { ... } }"
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: path.basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $RES.sendFile($P, ...)
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
              - pattern: createReadStream($P, ...)
          - focus-metavariable: $P

  # zip-slip: 압축 엔트리명을 검증 없이 디스크 쓰기 경로로 사용 (CWE-22).
  # 소스는 zip 라이브러리 고유 속성(adm-zip entryName, yauzl fileName)으로 한정해
  # 흔한 이름(.path 등)으로 인한 오탐을 피한다. 엔트리명 대신 자체 생성 파일명을
  # 쓰는 코드(안전한 구현)는 잡히지 않는다.
  - id: finguard.ts.zip-slip
    languages: [ts, js]
    severity: ERROR
    message: 압축 엔트리명이 검증 없이 파일 쓰기 경로로 사용되고 있습니다(zip-slip). 엔트리명은 아카이브 제작자가 정하므로 상위 경로(..)로 기준 디렉터리를 벗어날 수 있습니다. path.basename 으로 파일명만 취하거나, 정규화 후 기준 디렉터리 하위인지 확인해야 합니다.
    metadata:
      cwe: "CWE-22"
      category: security
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $E.entryName
          - pattern: $E.fileName
          - pattern: $E.getEntries()
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.mkdirSync($P, ...)
              - pattern: $FS.mkdir($P, ...)
              - pattern: writeFile($P, ...)
              - pattern: writeFileSync($P, ...)
              - pattern: createWriteStream($P, ...)
              - pattern: mkdirSync($P, ...)
          - focus-metavariable: $P

  # ── 언어 패리티 보강 (#27) ─────────────────────────────────────────────
  # java/python/go/kotlin 이 모두 갖고 있던 SQL 조립·암호재료·난수·TLS 룰의 TS 대응.
  # 국내 결제·핀테크 백엔드의 Node/NestJS 비중이 높아 이 결손은 스택 하나가
  # 통째로 미점검되는 문제였다.

  # SQL 삽입 (CWE-89).
  # taint 모드가 아니라 java.sql-string-build 와 같은 직접 patterns 구조다 — 증거 코드는
  # 환경변수·process.argv 값이 템플릿 리터럴에 직접 들어가고 $REQ.* 를 거치지 않아
  # taint 소스로는 잡히지 않는다.
  #
  # 두 갈래로 나눈다.
  #  (A) 이름 자체가 unsafe 를 선언하는 raw 실행 API($queryRawUnsafe·$executeRawUnsafe·
  #      Prisma.raw). 오탐 위험이 낮으므로 인자가 "상수 문자열 리터럴이 아니기만" 하면 잡는다.
  #      변수 하나만 넘기는 형태(script 를 split 해서 넘기는 증거 코드)도 여기서 걸린다.
  #      이 갈래만 정규식이다 — semgrep 1.169.0 은 `export namespace X { ... }` 본문 안의
  #      호출을 AST 패턴으로 매칭하지 못한다(같은 코드를 `namespace X` 로 바꾸면 매칭된다).
  #      실증거인 PaymentSetupWizard.ts 의 $executeRawUnsafe 가 정확히 그 형태라 AST 로는
  #      영영 미탐이 된다.
  #  (B) 범용 실행 싱크(.query/.execute/.raw). 이름만으로는 SQL 인지 알 수 없으므로
  #      인자에 템플릿 보간(${) 또는 문자열 연결(+)이 있고 SQL 키워드가 보일 때만 발화한다.
  #
  # 인자 개수(arity)로 안전을 판정하지 않는다 — 보간과 바인딩을 섞은
  # `pool.query(`... id = ${req.query.id} AND status = $1`, ["A"])` 가 정확히 취약하기 때문이다.
  # 태그드 템플릿($queryRaw`...`)은 진짜 파라미터화라 제외되지만, 그 안의 Prisma.raw() 는
  # 주입 재개통 경로라 (A) 에서 다시 잡는다.
  - id: finguard.ts.sql-injection
    languages: [ts, js]
    severity: ERROR
    message: SQL 문을 문자열 조립(템플릿 보간·연결)으로 만들어 실행하거나, 파라미터화를 우회하는 raw 실행 API 에 동적 문자열을 넘기고 있습니다. 조립에 쓰인 값이 외부 입력에서 유래하면 SQL 삽입이 가능합니다. 파라미터 바인딩($1 · ? · 태그드 템플릿)을 사용해야 합니다.
    metadata:
      cwe: "CWE-89"
      category: security
    patterns:
      - pattern-either:
          # (A) unsafe 를 이름으로 선언한 raw 실행 API — 인자가 상수 문자열 리터럴이 아니면 발화.
          #     첫 인자가 변수·호출·보간 템플릿·문자열 연결일 때만 매칭하므로
          #     $queryRawUnsafe("SELECT 1") 같은 상수 실행은 걸리지 않는다.
          - pattern-regex: '\$(?:query|execute)RawUnsafe\s*\(\s*(?:[A-Za-z_$][\w$]*(?:\.[\w$]+)*\s*[,)(]|`[^`]*\$\{|["''][^"'']*["'']\s*\+)'
          - pattern-regex: '\bPrisma\.(?:raw|sql)\s*\(\s*(?:[A-Za-z_$][\w$]*(?:\.[\w$]+)*\s*[,)(]|`[^`]*\$\{|["''][^"'']*["'']\s*\+)'
          # (B) 범용 싱크 — 보간·연결 + SQL 키워드가 함께 보일 때만
          - patterns:
              - pattern-either:
                  - pattern: $DB.query($Q, ...)
                  - pattern: $DB.execute($Q, ...)
                  - pattern: $DB.raw($Q, ...)
              # (A) 와 이중 검출되지 않도록 raw 실행 API 는 여기서 제외한다.
              - pattern-not: Prisma.raw(...)
              - pattern-not: Prisma.sql(...)
              - focus-metavariable: $Q
              # 조립 흔적(보간·연결)과 SQL 키워드를 한 정규식 안에서 함께 요구한다.
              # 두 조건을 pattern-either + pattern-regex 로 나누면 semgrep 이 두 매치의
              # 범위 교집합을 요구해, 조립 흔적과 키워드가 떨어져 있는 문자열이 누락된다.
              - metavariable-pattern:
                  metavariable: $Q
                  pattern-regex: '(?is)^(?=[\s\S]*(?:`[^`]*\$\{|["''][^"'']*["'']\s*\+|\+\s*["'']))[\s\S]*\b(?:select\s|insert\s+into\b|update\b[\s\S]*\bset\b|delete\s+from\b|merge\s+into\b|create\s+(?:table|schema|database|user)\b|drop\s+(?:table|schema|database)\b|alter\s+table\b|truncate\s+table\b|grant\s|from\s|where\s)'

  # 하드코드된 암호화 키·IV·salt, IV 없는 deprecated 암호 API (CWE-321).
  #
  # 한계(의도적): IV 가 "문자열 리터럴"이거나 아예 없는 경우만 본다. 테이블명 같은
  # 고정 상수에서 결정론적으로 파생한 IV(예: 이름을 16자로 자르거나 패딩)나 전역 단일 IV
  # 재사용은 이 룰로 잡히지 않는다 — 값 흐름 추적이 필요해 정적 정규식 범위를 벗어난다.
  # 그 경우는 별도 IV 재사용 룰이 필요하며 이 룰의 근거로 삼지 않는다.
  - id: finguard.ts.hardcoded-crypto-material
    languages: [regex]
    severity: ERROR
    message: 암호화 키·IV·salt 가 소스에 하드코드되어 있거나, IV 없는 deprecated 암호 API(createCipher)를 사용하고 있습니다. 소스 유출 시 암호화가 그대로 무력화됩니다. 키는 보호 저장소에서 로드하고 IV·salt 는 매번 안전한 난수로 생성해야 합니다.
    metadata:
      cwe: "CWE-321"
      category: security
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
      exclude: ["*.test.ts", "*.spec.ts", "*.test.js", "*.spec.js"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*))(?:\s*(?:export\s+)?(?:const|let|var|readonly|static|private|public|protected)\s+(?:\w*(?:crypto|aes|enc|encrypt|cipher|hmac|sign)_?(?:key|iv|salt)\w*|iv|salt|nonce|initvector|init_vector)\s*(?::\s*[\w<>?.\[\]|]+)?\s*=\s*["''`][A-Za-z0-9+/=_-]{7,}["''`]|.*\bcreateCipher\s*\(|.*\bcreate(?:Cipher|Decipher)iv\s*\([^)]*,\s*["''`][^"''`]{4,}["''`]\s*\))'

  # 취약한 암호 알고리즘 (CWE-327) — go.weak-crypto / python.weak-hash 의 TS 대응.
  - id: finguard.ts.weak-crypto
    languages: [regex]
    severity: WARNING
    message: MD5/SHA-1/DES/RC4/ECB 등 취약한 암호·해시 알고리즘을 사용하고 있습니다. SHA-256 이상, AES-GCM 등으로 교체해야 합니다.
    metadata:
      cwe: "CWE-327"
      category: security
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*(?:create(?:Hash|Hmac)\s*\(\s*["''`](?:md5|md4|sha1|sha-1)["''`]|create(?:Cipher|Decipher)iv\s*\(\s*["''`][^"''`]*(?:ecb|-des|des-|rc4|rc2)[^"''`]*["''`]|["''`](?:aes-\d+-ecb|des-ede3|des3|rc4)["''`])'

  # 예측 가능한 난수로 보안값 생성 (CWE-338).
  # 이름 조건 필수 — 화면용 ID·애니메이션 지연 등 비보안 용도의 Math.random 오탐을 막는다.
  # crypto.randomBytes/randomUUID/getRandomValues 는 애초에 매칭되지 않는다.
  #
  # 한계(의도적): 식별자에 보안 어휘가 전혀 없는 자격증명 생성기
  # (예: `const alphaNumeric = (n) => ... randint(...)` 를 비밀번호 생성에 쓰는 코드)는
  # 잡지 못한다. 이름 조건을 풀면 화면용 난수 전부가 오탐이 되어 도구를 못 쓰게 된다.
  - id: finguard.ts.insecure-random
    languages: [regex]
    severity: ERROR
    message: 보안값(키·토큰·OTP·salt·IV·세션ID 등)을 예측 가능한 난수로 생성하고 있습니다. Math.random 계열은 암호학적으로 안전하지 않습니다. crypto.randomBytes/randomUUID/getRandomValues 를 사용해야 합니다.
    metadata:
      cwe: "CWE-338"
      category: security
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
      exclude: ["*.test.ts", "*.spec.ts", "*.test.js", "*.spec.js"]
    # iv·seed·salt·nonce 는 부분문자열로 쓰면 drive·receive·assert 같은 흔한 식별자를
    # 통째로 먹으므로 완전 단어로만 본다. 나머지 어휘는 합성 식별자(otpCode·apiToken)를
    # 잡아야 해 부분문자열 매칭을 유지한다.
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*(?:\b(?:iv|seed|salt|nonce)\b|\b\w*(?:token|password|passwd|secret|apikey|api_key|privatekey|secretkey|seckey|sessionkey|cryptokey|encryptkey|otp)\w*\b)[^\n]*?\b(?:Math\.random\s*\(|randint\s*\(|_\.random\s*\(|lodash\.random\s*\()'

  # TLS 인증서 검증 비활성화 (CWE-295) — python.tls-verify-disabled / go.tls-skip-verify 의 TS 대응.
  # https.createServer 의 mTLS-optional 구성에서는 rejectUnauthorized:false 의 의미가 다르지만,
  # 미탐 비용이 더 커 감수한다(수동 확인 대상).
  - id: finguard.ts.tls-verify-disabled
    languages: [regex]
    severity: ERROR
    message: TLS 서버 인증서 검증을 비활성화하고 있습니다. 중간자 공격(MITM)에 그대로 노출됩니다. 사설 CA 는 검증을 끄는 대신 CA 인증서를 신뢰 목록에 추가해야 합니다.
    metadata:
      cwe: "CWE-295"
      category: security
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.jsx"]
    pattern-regex: '(?im)^(?![ \t]*(?://|\*|/\*)).*(?:rejectUnauthorized\s*:\s*false|strictSSL\s*:\s*false|insecureSkipTLSVerify\s*:\s*true|NODE_TLS_REJECT_UNAUTHORIZED["'']?\]?\s*=\s*["'']?0|checkServerIdentity\s*:\s*(?:\([^)]*\)|\w+)\s*=>\s*(?:undefined|null|\{\s*\}))'

  # ── AST 분석 사각지대 고지 (#66) ────────────────────────────────────────
  #
  # semgrep 1.169.0 의 TypeScript 파서는 `export namespace X { ... }` **블록 본문**의
  # 문장을 AST 패턴으로 매칭하지 못한다. 2026-08-22 실측(semgrep 1.169.0, 프로브 3종):
  #
  #   형태                                   AST 룰 발화
  #   top-level                              O
  #   namespace X { ... }                    O
  #   export namespace X { ... }             X  ← 갭
  #   namespace Outer { export namespace ... }  X  (중첩도 동일)
  #
  # 갭은 블록 단위다 — 같은 파일의 export namespace 바깥 코드는 정상 분석된다.
  # 정규식 모드(`languages: [regex]`) 룰은 파일 텍스트를 보므로 영향이 없다.
  # 이 파일에서 영향받는 룰: os-command-injection · open-redirect · ssrf ·
  # xss-innerhtml · path-traversal · zip-slip (전부 AST) + sql-injection 의 (B) 갈래.
  # sql-injection 의 (A) 갈래는 pattern-regex 라 블록 안에서도 발화한다.
  #
  # 문제의 본질은 미탐 자체가 아니라 **무음이 clean 과 구분되지 않는 것**이다.
  # 영향 룰을 통째로 정규식으로 바꾸는 대응은 택하지 않았다 — 여섯 중 다섯이 taint
  # 모드라 데이터흐름 없이는 재현할 수 없고, 정규식으로 근사하면 오탐이 폭증한다.
  # 대신 사각지대를 **보이게** 만든다: export namespace 블록 안에 AST 룰의 싱크가
  # 실제로 존재할 때만 INFO 로 고지해 수동 검토를 요청한다.
  #
  # 조건부인 이유(실측): samchon/payments 230 파일에 export namespace 는 118 개지만
  # 그중 싱크를 품은 블록은 10 개뿐이다. 무조건 고지하면 12 배의 소음이 되고
  # 그 소음이 곧 무시로 이어진다.
  #
  # 한계: (1) 블록 경계는 열 0 의 `}` 로 근사한다 — 들여쓴 중첩 export namespace
  # (실측 118 중 4)는 대상이 아니다. (2) 싱크 어휘는 이 파일의 AST 룰 싱크 목록에서
  # 뽑았으므로 AST 룰을 추가하면 여기도 같이 늘려야 한다.
  # semgrep 업그레이드로 갭이 해소되면 이 룰과 회귀 픽스처를 함께 제거한다.
  - id: finguard.ts.namespace-analysis-gap
    languages: [regex]
    severity: INFO
    message: 이 export namespace 블록은 semgrep 1.169.0 TypeScript 파서의 한계로 AST 기반 룰(명령 실행·SSRF·경로 조작·XSS·SQL 삽입 (B) 갈래)이 적용되지 않습니다. 블록 안에 해당 룰의 위험 API 호출이 있으므로 자동 점검 결과를 "이상 없음"으로 해석하면 안 되며 수동 검토가 필요합니다.
    metadata:
      category: security
    paths:
      include: ["*.ts", "*.tsx"]
    pattern-regex: '(?m)^export[ \t]+namespace[ \t]+[\w$.]+[^\n{]*\{(?:(?!^\}[ \t]*;?[ \t]*$)[\s\S])*?(?:\b(?:fetch|exec|execSync|spawn|spawnSync|readFile|readFileSync|writeFile|writeFileSync|createReadStream|createWriteStream|sendFile|mkdir|mkdirSync)[ \t]*\(|\.(?:innerHTML|outerHTML)[ \t]*=|\binsertAdjacentHTML[ \t]*\(|\bdocument\.write(?:ln)?[ \t]*\(|\.(?:query|execute|raw)[ \t]*\()'
