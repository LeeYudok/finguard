# GitHub 시크릿 스캐닝 제외 경로.
#
# finguard 는 시크릿 탐지 룰을 만드는 레포다. 그 룰의 정탐 픽스처는 정의상
# "시크릿처럼 생긴 문자열"이어야 하고, GitHub 의 탐지기도 값의 유효성이 아니라
# 형태만 보므로 **반드시 함께 트립된다**(#82).
#
# 예: finguard.config.firebase-api-key 는 `\bAIza[0-9A-Za-z_-]{35}\b` 를 잡는데,
# GitHub 의 google_api_key 탐지기도 같은 형태를 본다. 픽스처 값의 형태를 바꿔
# 회피하면 우리 룰이 잡지 못해 정탐 픽스처의 목적 자체가 사라진다.
#
# 그래서 값을 바꾸는 대신 경로를 제외한다. 제외는 픽스처 디렉터리로만 한정하며,
# 운영 코드·설정에서의 실제 유출 탐지는 그대로 유지한다.
paths-ignore:
  - "testdata/rule-fixtures/**"
